# CeraLive v2 image pipeline — CI gate.
#
# The SOLE image-build CI gate: the legacy Armbian build.sh path (and its
# build-images.yml workflow) has been removed. This workflow gates the 
# manifest+mkosi pipeline: lint -> schema -> unit tests -> multi-arch
# build-plan. No secrets are referenced; the build matrix runs DRY_RUN=1 so it
# performs no real download/build (no R2 creds, no GPG, no privileged container,
# no board required).
#
# Cross-host parity (task 15): the build matrix also emits a per-host sha256
# sidecar (test-results/host-$(uname -s)-$(uname -m).sha256) over the NORMALIZED
# mkosi build plan — a host-independent digest that, with T14's deterministic
# builds, fixes the output bytes. Same digest on two hosts ⇒ same plan ⇒ (by
# T14) bit-identical image. The only CI runner is Linux/x86_64; Fedora/Arch/
# macOS/WSL2 are documented-not-CI-verified in docs/dev-loop.md.
#
# addon-publish (task 35) stays inside the no-secrets invariant: it runs
# DRY_RUN=1 (plan only, uploads nothing) so the real aws-s3 upload in
# lib/upload-addons.sh never fires without R2_* creds + a signed artifact.
#
# Cross-runner build-plan determinism (C6b): build-plan-xrunner resolves the same
# DRY_RUN plan on TWO INDEPENDENT runners (ubuntu-24.04 + ubuntu-22.04) and
# build-plan-xrunner-gate asserts the NORMALIZED per-board plan sha256 is identical
# across them — extending task 15's SAME-host rebuild-parity to a CROSS-host gate.
# PLAN-ONLY (not a full .raucb build); starts ADVISORY (see that job's header for
# the runner-diversity rationale + promotion note).

name: v2 Pipeline CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck (v2 bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: shellcheck -x all v2 bash
        run: |
          mapfile -t files < <(git ls-files '**/*.sh' 'build' 'dev-push' 'run-tests')
          printf 'checking %d file(s)\n' "${#files[@]}"
          # .shellcheckrc (external-sources=true, source-path=SCRIPTDIR) is
          # auto-discovered from each script's parent dirs, so `source lib/*.sh`
          # resolves without per-call -x flags. --severity=warning: SC2015/SC1091
          # are info-level project baseline (see learnings, tasks 9/26/29).
          shellcheck --severity=warning -x "${files[@]}"

      # Fail FAST on a re-hardcoded suite. The gate also runs later inside
      # ./run-tests (tests/target-release-derivation.test.sh §B), but that is the
      # heavyweight bats job behind three `needs:` hops — so a one-line suite
      # literal would cost a full apt install, a system D-Bus and the whole
      # contract suite before reporting. Here it costs seconds and needs nothing
      # but bash + git. --self-test runs first because a sweep that silently read
      # no files would report a clean tree forever.
      - name: Target-release literal + mirror-drift gate
        run: |
          ci/check-suite-literals.sh --self-test
          ci/check-suite-literals.sh

  schema-validate:
    name: JSON-Schema validate manifests
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache resolver dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/requirements-ci.txt') }}

      - name: Install validators
        run: pip install --quiet --requirement ci/requirements-ci.txt

      - name: Validate every manifest against its schema
        run: python3 ci/validate-manifests.py

  bats:
    name: bats manifest unit suite
    runs-on: ubuntu-latest
    needs: schema-validate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache resolver dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/requirements-ci.txt') }}

      - name: Install resolver deps (resolve.py uses jsonschema + PyYAML)
        run: pip install --quiet --requirement ci/requirements-ci.txt

      - name: Install bats-core
        run: |
          git clone --depth=1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Install RK3588 disk-contract tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            avahi-daemon avahi-utils cpio dbus device-tree-compiler dosfstools \
            e2fsprogs gdisk iproute2 mtools procps rauc rauc-service socat \
            squashfs-tools systemd u-boot-tools util-linux

      - name: Start system D-Bus for real RAUC contract
        run: |
          if ! sudo busctl --system status >/dev/null 2>&1; then
            sudo dbus-daemon --system --fork
          fi
          sudo busctl call --system \
            org.freedesktop.DBus /org/freedesktop/DBus \
            org.freedesktop.DBus ReloadConfig
          sudo busctl --system status

      - name: Run v2 manifest unit suite
        run: |
          CERALIVE_RUN_REAL_AVAHI_CONTRACT=required \
            CERALIVE_RUN_REAL_RAUC_CONTRACT=required \
            CERALIVE_RUN_REAL_PRIVILEGE_DROP_CONTRACT=required ./run-tests

  edid-conformance:
    # The anti-corruption gate for the CeraLive HDMI-RX product EDIDs.
    #
    # `mkosi/runtime/edid/ceralive-hdmirx-<profile>.edid` are COMMITTED 256-byte
    # binaries that ceralive-hdmirx-edid.service writes into the HDMI receiver at
    # boot. A binary blob is the one kind of source file a reviewer cannot read,
    # so it is also the one that can rot silently: a wrong byte does not fail to
    # build, it ships a board that negotiates 4K30 (or nothing) and blames the
    # cable.
    #
    # TWO PROFILES, AND THE CONTENT GATE IS DIFFERENT FOR EACH. `full` is the
    # permissive 4K60 advertisement; `robust-4k60` is an HDMI 1.4-class one that
    # deliberately OMITS the HDMI Forum VSDB and offers 4K60 only as 4:2:0.
    # Several properties that are required in one are forbidden in the other, so
    # each profile carries both a "must contain" and a "must NOT contain" table
    # below. A single shared table would pass a blob that shipped the wrong
    # posture.
    #
    # Five legs close this:
    #   (i)   PROFILE SET — the generator's own list is the authority, and the
    #         committed blobs are exactly that set. A profile added to the
    #         generator with no committed blob (or the reverse) is RED here.
    #   (ii)  DRIFT — regenerate from tools/gen-hdmirx-edid.py and byte-compare
    #         against each committed blob. A blob edited by hand, or a generator
    #         changed without regenerating, is RED. This is what makes the
    #         generator the source of truth and the blobs merely its output.
    #   (iii) DECODED TEXT — the committed .txt beside each blob is what a human
    #         actually reviews, so it must describe THAT blob. Its embedded hex
    #         dump is compared against the blob's real bytes, which is a
    #         version-independent way to catch a stale decode (diffing the whole
    #         file would go red on any edid-decode version bump instead).
    #   (iv)  CONFORMITY — `edid-decode --check` must exit 0, with a non-vacuous
    #         tamper leg proving the checker actually bites on a flipped byte.
    #   (v)   CONTENT — the specific capabilities each profile depends on are
    #         asserted by name, in both directions. `--check` only proves the
    #         bytes are a VALID EDID; a perfectly valid blob carrying the wrong
    #         profile's blocks would sail through it.
    #
    # The generator is stdlib-only on purpose, so this job installs no Python
    # packages and never resolves ci/requirements-ci.txt.
    name: HDMI-RX EDID conformance (generator drift + edid-decode)
    runs-on: ubuntu-latest
    needs: shellcheck
    env:
      EDID_DIR: mkosi/runtime/edid
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install edid-decode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends edid-decode
          edid-decode --version || true

      - name: Profile set — the generator's list IS the committed blob set
        run: |
          set -euo pipefail
          # The generator is the authority. A profile it declares with no
          # committed blob would ship a selectable option that programs nothing;
          # a committed blob it does not declare is an unreachable file that no
          # drift gate below would ever regenerate.
          python3 tools/gen-hdmirx-edid.py --list-profiles | sort >/tmp/declared
          for blob in "${EDID_DIR}"/ceralive-hdmirx-*.edid; do
            name="${blob##*/ceralive-hdmirx-}"
            printf '%s\n' "${name%.edid}"
          done | sort >/tmp/committed
          if ! diff -u /tmp/declared /tmp/committed; then
            echo "::error::declared profiles and committed blobs disagree"
            exit 1
          fi
          echo "profiles: $(tr '\n' ' ' </tmp/declared)"

      - name: Generator is deterministic (two runs are byte-identical)
        run: |
          set -euo pipefail
          # Determinism is the property the drift gate below RESTS on. A
          # generator that embedded a build date would make every CI run red
          # for a reason that looks like blob corruption, so prove it first.
          while read -r profile; do
            python3 tools/gen-hdmirx-edid.py -p "${profile}" -o "${RUNNER_TEMP}/${profile}-run1.bin"
            python3 tools/gen-hdmirx-edid.py -p "${profile}" -o "${RUNNER_TEMP}/${profile}-run2.bin"
            cmp "${RUNNER_TEMP}/${profile}-run1.bin" "${RUNNER_TEMP}/${profile}-run2.bin"
            size=$(stat -c%s "${RUNNER_TEMP}/${profile}-run1.bin")
            [ "${size}" -eq 256 ] || {
              echo "::error::generated ${profile} EDID is ${size} bytes, expected 256 (2 blocks)"
              exit 1
            }
            printf '  ok   %s is deterministic; 256 bytes (base + CTA-861 extension)\n' "${profile}"
          done </tmp/declared

      - name: Drift gate — every committed blob equals its generator output
        run: |
          set -euo pipefail
          while read -r profile; do
            blob="${EDID_DIR}/ceralive-hdmirx-${profile}.edid"
            if ! cmp "${RUNNER_TEMP}/${profile}-run1.bin" "${blob}"; then
              echo "::error::${blob} does not match tools/gen-hdmirx-edid.py --profile ${profile} output"
              echo "regenerate with: python3 tools/gen-hdmirx-edid.py -p ${profile} -o ${blob}"
              cmp -l "${RUNNER_TEMP}/${profile}-run1.bin" "${blob}" | head -40
              exit 1
            fi
            sha256sum "${blob}"
          done </tmp/declared

      - name: The two profiles are DIFFERENT blobs
        run: |
          set -euo pipefail
          # Two identical blobs would make the runtime profile choice a no-op
          # that still logs a profile name — the worst kind of working feature.
          if cmp -s "${EDID_DIR}/ceralive-hdmirx-full.edid" \
                    "${EDID_DIR}/ceralive-hdmirx-robust-4k60.edid"; then
            echo "::error::the full and robust-4k60 blobs are byte-identical"
            exit 1
          fi
          echo "the two profiles differ, as they must"

      - name: Committed decoded text describes the committed blob
        run: |
          set -euo pipefail
          # The .txt is the human-review artifact. A stale one is worse than a
          # missing one: it reads as reviewed. Its leading hex dump is compared
          # to the real bytes, which is independent of the edid-decode version
          # that happens to be installed on this runner.
          while read -r profile; do
            blob="${EDID_DIR}/ceralive-hdmirx-${profile}.edid"
            python3 - "${blob}" "${blob}.txt" <<'PY'
          import re, sys
          blob, text = sys.argv[1], sys.argv[2]
          raw = open(blob, "rb").read()
          body = open(text).read().split("----------------")[0]
          hexed = bytes.fromhex("".join(re.findall(r"^(?:[0-9a-f]{2} ?)+$", body, re.M)))
          if hexed != raw:
              sys.exit(f"::error::{text} hex dump does not match {blob} "
                       f"({len(hexed)} decoded bytes vs {len(raw)})")
          print(f"  ok   {text} decodes the committed {len(raw)}-byte blob")
          PY
            grep -q '^EDID conformity: PASS$' "${blob}.txt" || {
              echo "::error::${blob}.txt does not record a PASS verdict"
              exit 1
            }
          done </tmp/declared

      - name: edid-decode --check passes on every committed blob
        run: |
          set -euo pipefail
          while read -r profile; do
            blob="${EDID_DIR}/ceralive-hdmirx-${profile}.edid"
            edid-decode --check "${blob}" | tee "${RUNNER_TEMP}/${profile}-decoded.txt"
            grep -q '^EDID conformity: PASS' "${RUNNER_TEMP}/${profile}-decoded.txt"
          done </tmp/declared

      - name: Both block checksums are valid, in every blob
        run: |
          set -euo pipefail
          # edid-decode prints one "Checksum: 0xNN" per block, and appends
          # "(should be 0xMM)" plus an "Invalid checksum" line when one is wrong.
          # `|| true` on both counts: grep exits 1 on zero matches, which under
          # `set -e` would abort the assignment before it could be reported.
          while read -r profile; do
            decoded="${RUNNER_TEMP}/${profile}-decoded.txt"
            count=$(grep -c '^Checksum: 0x' "${decoded}" || true)
            [ "${count}" -eq 2 ] || {
              echo "::error::${profile}: expected 2 block checksums, found ${count}"
              exit 1
            }
            bad=$(grep -cE 'Invalid checksum|Checksum: 0x[0-9a-f]+ \(should be' "${decoded}" || true)
            [ "${bad}" -eq 0 ] || {
              echo "::error::${profile}: ${bad} block checksum(s) invalid"
              grep -nE 'Invalid checksum|\(should be' "${decoded}"
              exit 1
            }
            printf '  ok   %s: both block checksums valid\n' "${profile}"
          done </tmp/declared

      - name: Capability assertions — per profile, in BOTH directions
        run: |
          set -euo pipefail
          # Each of these is a capability an operator would notice the loss of,
          # or a claim whose PRESENCE would defeat the profile's whole purpose.
          decoded=""
          assert() {
            local label="$1" pattern="$2"
            if ! grep -qE -- "${pattern}" "${decoded}"; then
              echo "::error::missing from decoded EDID: ${label} (/${pattern}/)"
              exit 1
            fi
            printf '  ok       %s\n' "${label}"
          }
          refute() {
            local label="$1" pattern="$2"
            if grep -qE -- "${pattern}" "${decoded}"; then
              echo "::error::MUST NOT be in decoded EDID: ${label} (/${pattern}/)"
              grep -nE -- "${pattern}" "${decoded}"
              exit 1
            fi
            printf '  ok       no %s\n' "${label}"
          }

          while read -r profile; do
            decoded="${RUNNER_TEMP}/${profile}-decoded.txt"
            printf '%s:\n' "${profile}"

            # --- shared by both profiles ---------------------------------
            # The identity pair is what stops us advertising somebody else's
            # product name to every camera we capture from.
            assert 'manufacturer CRL'          '^ +Manufacturer: CRL$'
            assert 'product name CeraLive HDMI' "^ +Display Product Name: 'CeraLive HDMI'$"
            assert 'legacy HDMI VSDB max TMDS clock 300 MHz' \
                   '^ +Maximum TMDS clock: 300 MHz$'
            assert 'Basic audio support'       '^ +Basic audio support$'
            assert 'LPCM audio descriptor'     '^ +Linear PCM:$'
            assert '2-channel LPCM SAD'        '^ +Max channels: 2$'
            # 88.2/96 kHz are advertised because the engine resamples on the way
            # in: accepting a higher-rate embedded stream beats refusing it and
            # having the source fall back to no audio at all.
            assert 'LPCM sample rates 32/44.1/48/88.2/96 kHz' \
                   '^ +Supported sample rates \(kHz\): 96 88\.2 48 44\.1 32$'
            assert 'LPCM sample sizes 16/20/24 bit' \
                   '^ +Supported sample sizes \(bits\): 24 20 16$'
            assert 'Speaker Allocation FL/FR'  '^ +FL/FR - Front Left/Right$'
            assert 'YCbCr 4:2:2'               '^ +Supports YCbCr 4:2:2$'
            # Dropped in BOTH profiles: the engine cannot consume NV24, so
            # advertising 4:4:4 invites a format the pipeline would discard.
            refute 'YCbCr 4:4:4'               '^ +Supports YCbCr 4:4:4$'

            case "${profile}" in
              full)
                # VIC 97/96 plus the 600 MHz + SCDC pair are what let a source
                # send 4K60 at all; the Y420CMDB adds 4:2:0 to modes that are
                # already RGB/4:2:2-capable, which is why it is a CAPABILITY MAP
                # and not a Y420VDB (that would mean 4:2:0-ONLY).
                assert 'preferred timing 3840x2160 ~60 Hz' \
                       '^ +DTD 1: +3840x2160 +(60\.0|59\.9)[0-9]* Hz'
                assert 'VIC 97 (3840x2160p60)'     '^ +VIC +97: +3840x2160'
                assert 'VIC 96 (3840x2160p50)'     '^ +VIC +96: +3840x2160'
                assert 'Maximum TMDS Character Rate: 600' \
                       '^ +Maximum TMDS Character Rate: 600'
                assert 'SCDC Present'              '^ +SCDC Present$'
                assert 'YCbCr 4:2:0 Capability Map Data Block' \
                       '^ +YCbCr 4:2:0 Capability Map Data Block:$'
                refute 'YCbCr 4:2:0 Video Data Block' \
                       '^ +YCbCr 4:2:0 Video Data Block:$'
                ;;
              robust-4k60)
                # An HDMI 1.4-class advertisement: no HDMI Forum VSDB at all, so
                # no SCDC and no >300 MHz claim, and 4K60 offered ONLY as 4:2:0.
                # The preferred timing must itself be sendable without
                # scrambling, or the profile offers a mode it just said the
                # source cannot signal.
                assert 'preferred timing 3840x2160 ~30 Hz' \
                       '^ +DTD 1: +3840x2160 +(30\.0|29\.9)[0-9]* Hz'
                assert 'preferred timing at 297 MHz' \
                       '^ +DTD 1: .* 297\.000000 MHz'
                assert 'second timing 1920x1080 ~60 Hz' \
                       '^ +DTD 2: +1920x1080 +(60\.0|59\.9)[0-9]* Hz'
                assert 'monitor range max dotclock 300 MHz' \
                       '^ +Monitor ranges .*max dotclock 300 MHz$'
                assert 'YCbCr 4:2:0 Video Data Block' \
                       '^ +YCbCr 4:2:0 Video Data Block:$'
                assert 'VIC 95 (3840x2160p30) still offered' \
                       '^ +VIC +95: +3840x2160'
                refute 'HDMI Forum VSDB' \
                       '^ +Vendor-Specific Data Block \(HDMI Forum\)'
                refute 'SCDC Present'              '^ +SCDC Present$'
                refute 'a >300 MHz TMDS character rate' \
                       '^ +Maximum TMDS Character Rate:'
                refute 'YCbCr 4:2:0 Capability Map Data Block' \
                       '^ +YCbCr 4:2:0 Capability Map Data Block:$'
                ;;
              *)
                echo "::error::profile '${profile}' has no assertion table"
                exit 1
                ;;
            esac
          done </tmp/declared

      - name: 4K60 appears in exactly ONE of the two 4:2:0 block kinds, per profile
        run: |
          set -euo pipefail
          # The Y420VDB/Y420CMDB pair is the sharpest edge in this change: they
          # differ by one byte on the wire and make opposite claims. A blob that
          # listed VIC 97 in the ordinary Video Data Block AND in a Y420VDB
          # would be self-contradictory ("4:2:0-only" and "also RGB") while
          # remaining a structurally valid EDID that --check accepts.
          vdb_has() {
            sed -n '/^ *Video Data Block:$/,/^ *[A-Z].*:$/p' "$1" \
              | grep -qE "^ +VIC +$2: "
          }
          full="${RUNNER_TEMP}/full-decoded.txt"
          robust="${RUNNER_TEMP}/robust-4k60-decoded.txt"
          for vic in 97 96; do
            vdb_has "${full}" "${vic}" || {
              echo "::error::full: VIC ${vic} must be in the ordinary Video Data Block"; exit 1; }
            if vdb_has "${robust}" "${vic}"; then
              echo "::error::robust-4k60: VIC ${vic} must NOT be in the ordinary Video Data Block (it is 4:2:0-only there)"
              exit 1
            fi
            printf '  ok   VIC %s: in full'"'"'s VDB, absent from robust-4k60'"'"'s\n' "${vic}"
          done

      - name: Gate bites — a tampered blob MUST fail edid-decode (non-vacuous)
        run: |
          set -euo pipefail
          # Without this leg an always-passing conformity check would look
          # identical to a working one. Run against every profile, because a
          # loop that only ever tampered with the first blob would be as
          # vacuous as no loop at all.
          while read -r profile; do
            tampered="${RUNNER_TEMP}/${profile}-tampered.bin"
            cp "${EDID_DIR}/ceralive-hdmirx-${profile}.edid" "${tampered}"
            printf '\x99' | dd of="${tampered}" bs=1 seek=100 count=1 conv=notrunc status=none
            if edid-decode --check "${tampered}" > "${RUNNER_TEMP}/${profile}-tampered.txt" 2>&1; then
              cat "${RUNNER_TEMP}/${profile}-tampered.txt"
              echo "::error::edid-decode --check ACCEPTED a corrupted ${profile} EDID"
              exit 1
            fi
            grep -q 'Invalid checksum' "${RUNNER_TEMP}/${profile}-tampered.txt"
            printf '  ok   %s: tamper rejected on the base-block checksum, as designed\n' "${profile}"
          done </tmp/declared

  size-gate:
    # Blocking per-board size ceiling. measure-size.sh sizes rootfs CONTENT
    # (du --apparent-size -sb — NOT the frozen 4096 MB partition, G4/E5). DRY_RUN
    # ships no real rootfs, so the positive leg uses a synthetic under-budget tree
    # and the negative leg a sparse 2 GiB tree that MUST trip the gate — without
    # the negative leg an always-passing gate would look identical.
    name: rootfs size gate (blocking)
    runs-on: ubuntu-latest
    needs: bats
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Gate passes — synthetic tree under the committed ceiling (enforced, exit 0)
        run: |
          set -o pipefail
          art="${RUNNER_TEMP}/rootfs-sample"
          mkdir -p "${art}"
          head -c 4096 /dev/zero > "${art}/placeholder.bin"
          ./lib/measure-size.sh rock-5b-plus "${art}" 2>&1 | tee size-report.log
          grep -Eq 'measured=[0-9]+ budget=[0-9]+ \(enforced\)' size-report.log

      - name: Regression check — compare against baseline (non-blocking warning)
        run: |
          set -o pipefail
          # Extract measured bytes from the size-report.log produced above.
          # measure-size.sh outputs: "measured=<bytes> budget=<bytes> (enforced)"
          measured_bytes=$(grep -oP 'measured=\K[0-9]+' size-report.log | head -1)
          if [ -z "${measured_bytes}" ]; then
            echo "::warning::could not extract measured bytes from size-report.log"
            exit 0
          fi
          echo "Extracted measured bytes: ${measured_bytes}"
          # Invoke the regression comparator. It exits 0 if within threshold,
          # exits 1 if growth exceeds 50 MB, exits 2 on bad args/missing baseline.
          # We treat exit 1 (threshold exceeded) as a warning, not a hard failure,
          # since the absolute 1.5 GB gate already passed.
          set +e
          ./ci/check-size-regression.sh "${measured_bytes}" ci/size-baseline.json 2>&1 | tee size-regression.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "${exit_code}" -ne 0 ]; then
            if [ "${exit_code}" -eq 1 ]; then
              echo "::warning::image size growth exceeds 50 MB threshold (see size-regression.log)"
            else
              echo "::error::regression check failed with exit code ${exit_code}"
              exit "${exit_code}"
            fi
          fi

      - name: Gate bites — sparse over-budget tree MUST fail the gate (non-vacuous)
        run: |
          # die() writes "exceeds budget" to stderr — fold it into the log (2>&1)
          # so the grep below sees it; the if guards the gate's non-zero exit.
          over="${RUNNER_TEMP}/rootfs-over"
          mkdir -p "${over}"
          truncate -s 2G "${over}/oversize.img"
          if ./lib/measure-size.sh rock-5b-plus "${over}" > size-over.log 2>&1; then
            cat size-over.log
            echo "::error::size gate did NOT fail on an over-budget rootfs"
            exit 1
          fi
          cat size-over.log
          grep -q 'exceeds budget' size-over.log

  addon-publish:
    # Feature-sysext R2 publish contract. The real path (lib/upload-addons.sh,
    # aws s3 cp + R2 endpoint — same pattern as fetch-debs.sh) only fires with
    # R2_* creds AND a signed .raw, neither present here. So this job proves the
    # contract under DRY_RUN: a synthetic SIGNED artifact set asserts the plan
    # targets the canonical addons/{os_version}/{board}/{feature} keys with the
    # right per-file content-type, and a non-vacuous negative leg asserts the
    # trust gate REFUSES an unsigned .raw (no upload without a .sig).
    name: addon publish contract (dry-run plan + unsigned-refusal gate)
    runs-on: ubuntu-latest
    needs: bats
    steps:
      - uses: actions/checkout@v7

      - name: Plan targets the per-board/per-OS R2 keys (DRY_RUN, signed inputs)
        env:
          DRY_RUN: '1'
          R2_BUCKET: apt-storage
          R2_ENDPOINT: https://r2.example
        run: |
          set -euo pipefail
          # The delivery path's {os_version} axis IS the target-release mapping's, so
          # the fixture stem and the expected keys derive from it. Passing no
          # --os-version additionally proves the publisher's own default is that
          # same mapping, which is what keeps builder and publisher in lockstep.
          . ./lib/shared/target-release-lib.sh
          target_release_load
          dist="${RUNNER_TEMP}/addon-dist"
          mkdir -p "${dist}"
          stem="debug-toolset-rock-5b-plus-${OS_VERSION_ID}"
          head -c 4096 /dev/zero > "${dist}/${stem}.raw"
          ( cd "${dist}" && sha256sum "${stem}.raw" > "${stem}.raw.sha256" )
          printf 'stub-detached-signature\n' > "${dist}/${stem}.raw.sig"
          ./lib/upload-addons.sh \
            --feature debug-toolset --board rock-5b-plus \
            --dist "${dist}" 2>&1 | tee addon-plan.log
          key="s3://apt-storage/addons/${OS_VERSION_ID}/rock-5b-plus/debug-toolset"
          grep -qF "${key}.raw " addon-plan.log
          grep -qF "${key}.raw.sha256" addon-plan.log
          grep -qF "${key}.raw.sig" addon-plan.log
          # Content-type pinned per file so R2 stores what the worker serves.
          grep -q 'debug-toolset.raw --endpoint-url https://r2.example --content-type application/octet-stream' addon-plan.log
          grep -q 'debug-toolset.raw.sig --endpoint-url https://r2.example --content-type text/plain' addon-plan.log

      - name: Trust gate bites — an UNSIGNED add-on MUST be refused (non-vacuous)
        env:
          DRY_RUN: '1'
          R2_BUCKET: apt-storage
          R2_ENDPOINT: https://r2.example
        run: |
          . ./lib/shared/target-release-lib.sh
          target_release_load
          dist="${RUNNER_TEMP}/addon-unsigned"
          mkdir -p "${dist}"
          stem="debug-toolset-rock-5b-plus-${OS_VERSION_ID}"
          head -c 4096 /dev/zero > "${dist}/${stem}.raw"
          ( cd "${dist}" && sha256sum "${stem}.raw" > "${stem}.raw.sha256" )
          # No .raw.sig on purpose — the publisher MUST refuse to upload.
          if ./lib/upload-addons.sh \
               --feature debug-toolset --board rock-5b-plus \
               --dist "${dist}" > addon-unsigned.log 2>&1; then
            cat addon-unsigned.log
            echo "::error::upload-addons.sh published an UNSIGNED add-on"
            exit 1
          fi
          cat addon-unsigned.log
          grep -q 'refusing to publish UNSIGNED add-on' addon-unsigned.log

  build-matrix:
    # Dry-run resolves the containerized build plan for both arches, then emits a
    # cross-host sha256 sidecar over the NORMALIZED plan (task 15): same digest
    # across hosts ⇒ identical builder invocation ⇒ (by T14's deterministic
    # builds) a bit-identical image. A second resolve asserts the digest is
    # reproducible (parity has teeth). Sidecar uploaded as host-sha256-<board>.
    name: build dry-run + host sha256 (${{ matrix.board }})
    runs-on: ubuntu-latest
    needs: bats
    strategy:
      fail-fast: false
      matrix:
        # rk3588 (arm64) and x86 (amd64) — proves the manifest -> builder
        # pipeline resolves for both arches without hardware.
        board: [rock-5b-plus, x86-minipc]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache resolver dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/requirements-ci.txt') }}

      - name: Install resolver deps
        run: pip install --quiet --requirement ci/requirements-ci.txt

      - name: Materialize non-production RAUC test fixture
        run: ./tests/generate-dev-rauc-pki.sh

      - name: Dry-run build (manifest -> builder plan; no network/hardware)
        env:
          DRY_RUN: '1'
          INSTALL_BOOT_BSP: '0'
        run: |
          ./build "${{ matrix.board }}" 2>&1 | tee build-dryrun.log

      - name: Assert no real download/build happened (no secret leakage)
        run: |
          # run_or_plan logs "exec: <cmd>" for REAL commands and "DRY-RUN would
          # run: <cmd>" for planned ones; a real mkosi/docker build prints
          # "Fetched"/progress. Fail loudly if the dry-run leaked any of those.
          if grep -qiE '^\[INFO \].*exec: (apt-get|aws|gh|docker|mkosi)|^Fetched |docker run ' build-dryrun.log; then
            echo "::error::DRY_RUN performed a real network/build command"
            exit 1
          fi
          grep -q 'DRY-RUN complete' build-dryrun.log

      - name: Emit host sha256 sidecar (cross-host build-plan parity, task 15)
        run: |
          # Cross-host parity proxy. CI cannot run the real privileged mkosi
          # build (no network/privileged container/board under DRY_RUN), so it
          # cannot emit the real .raucb sha256 (that is T14's full-build proof).
          # What it CAN prove is that this host resolves the *exact same builder
          # invocation* every other host would — the normalized mkosi plan that,
          # combined with T14's SOURCE_DATE_EPOCH determinism, fully fixes the
          # output bytes. Two hosts whose sidecars match resolve an identical
          # plan; given T14 they would produce a bit-identical image.
          #
          # The raw plan line embeds this checkout's ABSOLUTE path (differs per
          # host/runner), so strip it to a stable <REPO> token before hashing —
          # otherwise the sha would encode the runner's workdir, not the build.
          set -euo pipefail
          mkdir -p test-results
          repo="${GITHUB_WORKSPACE:-$PWD}"
          # Container-path assertion: the dry-run MUST resolve the containerized
          # builder (docker/podman) on the runner, never the --native opt-in.
          if ! grep -Eq 'DRY_RUN=1 \((docker|podman)\)' build-dryrun.log; then
            echo "::error::build-matrix did not resolve the container path (expected docker/podman)"
            exit 1
          fi
          plan="$(grep -F 'would build with:' build-dryrun.log \
                  | sed -E 's/^.*would build with: //' \
                  | sed "s#${repo}#<REPO>#g")"
          [ -n "${plan}" ] || { echo "::error::no resolved mkosi plan in build-dryrun.log"; exit 1; }
          sha="$(printf '%s\n' "${plan}" | sha256sum | cut -d' ' -f1)"
          host="$(uname -s)-$(uname -m)"
          sidecar="test-results/host-${host}.sha256"
          # sha256sum-style line (machine-checkable); board-tagged so a multi-leg
          # matrix never produces an ambiguous "which board?" digest.
          printf '%s  %s.buildplan\n' "${sha}" "${{ matrix.board }}" > "${sidecar}"
          echo "wrote ${sidecar}:"; cat "${sidecar}"
          echo "PLAN_SHA=${sha}" >> "$GITHUB_ENV"

      - name: Assert sha256 parity (rebuild → identical normalized plan, has teeth)
        env:
          DRY_RUN: '1'
          INSTALL_BOOT_BSP: '0'
        run: |
          # Reproducibility teeth: re-resolve the same board and assert the
          # normalized plan sha is BYTE-IDENTICAL to the sidecar. A non-vacuous
          # parity gate — if board resolution ever became host/time-dependent
          set -euo pipefail
          repo="${GITHUB_WORKSPACE:-$PWD}"
          ./build "${{ matrix.board }}" 2>&1 | tee build-dryrun-2.log >/dev/null
          plan2="$(grep -F 'would build with:' build-dryrun-2.log \
                   | sed -E 's/^.*would build with: //' \
                   | sed "s#${repo}#<REPO>#g")"
          sha2="$(printf '%s\n' "${plan2}" | sha256sum | cut -d' ' -f1)"
          if [ "${sha2}" != "${PLAN_SHA}" ]; then
            echo "::error::build-plan sha256 not reproducible: ${PLAN_SHA} != ${sha2}"
            exit 1
          fi
          echo "sha256 parity OK: ${PLAN_SHA} (identical across rebuilds on $(uname -s)-$(uname -m))"

      - name: Upload host sha256 sidecar
        uses: actions/upload-artifact@v7
        with:
          name: host-sha256-${{ matrix.board }}
          path: test-results/host-*.sha256
          if-no-files-found: error

  qemu:
    # AMD64 matrix leg only: boot the x86 (x86-minipc) disk image headlessly in
    # qemu and assert it reaches multi-user.target + ceralive.service health +
    # critical packages (tests/qemu-x86.sh, task 36). qemu is REQUIRED in CI
    # (MAC4: fail loudly if missing, not skip). The DRY_RUN build-matrix above
    # ships no bootable image, so the BOOT step gracefully skips when the image
    # is absent (but qemu itself MUST be present). The SELFTEST step always runs
    # the harness's own negative test (a variant missing a critical package MUST
    # fail the gate) so this job proves the gate logic on every push even before
    # real image artifacts are wired up.
    #
    # NOT a substitute for the RK3588 real-hardware smoke (realhw-smoke.sh / task
    # 38) — this only validates the x86 amd64 OS+service layer boots.
    #
    # Timeout model: 10 min provisioning + 10 min TCG + 10 min runner overhead.
    # The inner bounds preserve the QEMU budget even when apt is slow.
    name: qemu x86 assertion-engine selftest (amd64)
    runs-on: ubuntu-latest
    needs: build-matrix
    timeout-minutes: 30
    env:
      PROVISION_BUDGET_MINUTES: '10'
      QEMU_TIMEOUT_MINUTES: '10'
      RUNNER_OVERHEAD_BUDGET_MINUTES: '10'
    steps:
      - uses: actions/checkout@v7

      - name: Install qemu-system-x86 + OVMF (EFI/GRUB x86 image boots via UEFI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          qemu-system-x86_64 --version | head -1

      - name: Verify qemu-system-x86_64 is available (MAC4 — fail loudly if missing)
        run: |
          if ! command -v qemu-system-x86_64 &>/dev/null; then
            echo "::error::qemu-system-x86_64 not found in PATH after install step"
            exit 1
          fi
          echo "qemu-system-x86_64 available: $(qemu-system-x86_64 --version | head -1)"

      - name: SELFTEST — assertion engine + negative gate (no qemu/image needed)
        env:
          CERALIVE_QEMU_SELFTEST: '1'
        run: ./tests/qemu-x86.sh

  # ---------------------------------------------------------------------------
  # Cross-runner build-plan determinism gate (C6b) — PLAN-ONLY, ADVISORY.
  #
  # WHAT: resolves the DRY_RUN mkosi build plan on TWO INDEPENDENT GitHub-hosted
  # runners (ubuntu-24.04 + ubuntu-22.04) for each board, hashes the NORMALIZED
  # plan per board (the SAME task-15 normalization the build-matrix job uses,
  # factored into ci/emit-build-plan-sha.sh), then the gate job asserts the
  # per-board sha256 is IDENTICAL across the two runners (ci/assert-xrunner-
  # parity.sh). A divergent plan sha ⇒ the plan leaked host state ⇒ RED.
  #
  # This EXTENDS the build-matrix job's SAME-host rebuild-parity into a CROSS-host
  # check: rebuild-parity catches time-dependence on one host; this catches
  # HOST-dependence (hostname / arch / toolchain version / an un-normalized
  # absolute path) that a single host can never surface.
  #
  # RUNNER-DIVERSITY CHOICE (documented per task C6b): TWO INDEPENDENT GH-HOSTED
  # RUNNERS of different OS images — ubuntu-24.04 + ubuntu-22.04 (both x86_64).
  # WHY these, and not cross-OS/arch or two containers:
  #   * The v2 build's DRY_RUN plan resolution needs a Linux CONTAINER runtime
  #     (docker/podman — select_build_mode dies without one) + GNU coreutils. macOS
  #     GH runners ship no docker daemon and BSD tools; Windows has no Linux
  #     container path — so neither can run this resolution. True cross-OS runner
  #     diversity is NOT available for this build (this file's header already notes
  #     "The only CI runner is Linux/x86_64").
  #   * ubuntu-24.04 vs ubuntu-22.04 are two genuinely INDEPENDENT runner VMs with
  #     DIFFERENT toolchains (glibc 2.39 vs 2.35, coreutils, python, docker) — real
  #     host diversity that catches toolchain-dependent plan drift — while being
  #     guaranteed-available and fast on ANY repo tier (no arm64/macOS capacity
  #     flakiness — honours the "don't ship a flaky blocking gate" rule).
  #   * The matrix is one line from an arm64 leg (ubuntu-24.04-arm) once that
  #     runner's capacity/cost is confirmed for this repo — the strongest proof, but
  #     not a reliable default today. Two isolated containers were the documented
  #     fallback; not needed — genuine independent runners ARE available here.
  #
  # SCOPE GUARD: this compares the deterministic PLAN / input closure, NOT a dual-
  # host full .raucb image build (CI runs no privileged mkosi build). Full-artifact
  # determinism remains future work — see docs/RELEASE-PROCESS.md §4
  # "CI determinism coverage — cross-runner build-plan gate (C6b)".
  #
  # NON-BLOCKING / PROMOTION NOTE: starts ADVISORY. `continue-on-error` on BOTH jobs
  # is gated on the repo variable XRUNNER_PARITY_BLOCKING — UNSET (default) ⇒
  # continue-on-error true ⇒ the gate annotates red but does NOT fail the workflow
  # run (non-blocking). PROMOTE by setting repo variable XRUNNER_PARITY_BLOCKING=true
  # (and adding `build-plan-xrunner-gate` to the branch-protection required checks)
  # ONCE one green CI run confirms both DRY_RUN legs + the gate complete within the
  # existing CI time budget (the resolve is ~seconds, so this is expected to pass
  # immediately). Do NOT make it a REQUIRED check while it is advisory.
  # ---------------------------------------------------------------------------
  build-plan-xrunner:
    name: build-plan cross-runner sha (${{ matrix.os }} / ${{ matrix.board }}) [plan-only]
    runs-on: ${{ matrix.os }}
    needs: bats
    # Advisory by default; promote to blocking via repo var XRUNNER_PARITY_BLOCKING.
    continue-on-error: ${{ vars.XRUNNER_PARITY_BLOCKING != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # TWO INDEPENDENT runners × the SAME board matrix as build-matrix above.
        os: [ubuntu-24.04, ubuntu-22.04]
        board: [rock-5b-plus, x86-minipc]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache resolver dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/requirements-ci.txt') }}

      - name: Install resolver deps
        run: pip install --quiet --requirement ci/requirements-ci.txt

      - name: Materialize non-production RAUC test fixture
        run: ./tests/generate-dev-rauc-pki.sh

      - name: Resolve DRY_RUN plan → normalized sha sidecar (this runner)
        run: |
          set -euo pipefail
          mkdir -p test-results
          # emit-build-plan-sha.sh runs DRY_RUN=1 INSTALL_BOOT_BSP=0 itself, asserts
          # the container path, strips the abs repo path, and hashes the normalized
          # plan line — the SAME normalization as the build-matrix task-15 step.
          ./ci/emit-build-plan-sha.sh \
            --board "${{ matrix.board }}" \
            --out "test-results/xrunner__${{ matrix.os }}__${{ matrix.board }}.sha256"
          echo "sidecar (runner=${{ matrix.os }}, board=${{ matrix.board }}):"
          cat "test-results/xrunner__${{ matrix.os }}__${{ matrix.board }}.sha256"

      - name: Upload per-runner sidecar
        uses: actions/upload-artifact@v7
        with:
          name: xrunner-plan-${{ matrix.os }}-${{ matrix.board }}
          path: test-results/xrunner__*.sha256
          if-no-files-found: error

  build-plan-xrunner-gate:
    name: build-plan cross-runner determinism gate [plan-only, advisory]
    runs-on: ubuntu-latest
    needs: build-plan-xrunner
    # Advisory by default (see PROMOTION NOTE above); flip to blocking by setting
    # the repo variable XRUNNER_PARITY_BLOCKING=true after a green in-budget run.
    continue-on-error: ${{ vars.XRUNNER_PARITY_BLOCKING != 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download every per-runner sidecar
        uses: actions/download-artifact@v8
        with:
          pattern: xrunner-plan-*
          path: xrunner-sidecars
          merge-multiple: true

      - name: List the collected per-runner sidecars
        run: |
          echo "collected per-runner build-plan sidecars:"
          find xrunner-sidecars -type f -name '*.sha256' | sort | while read -r f; do
            printf '%s: ' "$(basename "$f")"; cat "$f"
          done

      - name: Assert cross-runner plan-hash equality (has teeth — RED on mismatch)
        run: |
          # Explicit hash-equality assertion: for EVERY board, all runners must
          # agree on the normalized plan sha256. --expect-runners 2 makes a missing
          # leg a failure (never a vacuous pass). Exit 1 ⇒ determinism regression.
          ./ci/assert-xrunner-parity.sh xrunner-sidecars --expect-runners 2
