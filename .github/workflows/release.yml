name: Release candidate build

# Keep the triggering run identity for candidate provenance; execute trusted
# build steps from master through the workflow-restricted runner group.
on:
  push:
    branches: ['release/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: CERALIVE/image-building-pipeline/.github/workflows/release-candidate-build.yml@master
    secrets: inherit
