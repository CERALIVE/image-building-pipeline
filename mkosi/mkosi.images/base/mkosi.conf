# CeraLive v2 — BASE OS layer (Stage 1)
#
# The shared foundation every platform family builds on: a minimal Debian rootfs
# TREE. Distribution / Release / Architecture / Repositories are inherited from
# ../../mkosi.conf (global), so this stays arch-parametric AND suite-parametric —
# the suite itself comes from ../../../manifests/target-release.env and is never
# named here.
#
# Output = Format=directory (NOT a disk). The base is a composable tree that the
# upper layers add packages to (see mkosi/LAYER-MAP.md):
#   platform -> HW-accel GStreamer + kernel/U-Boot/DTB/firmware (the only arch-specific layer)
#   runtime  -> shared.list package set + rauc/u-boot-tools + system config
#   app      -> first-party cerastream/srtla/CeraUI + CERALIVE/srt fork .deb
# Only the final assembly step turns the merged tree into a Format=disk image with
# the real partition layout + dm-verity + A/B. Keeping each layer Format=directory
# keeps outputs small and composable.
#
# MINIMAL means minimal. ONLY systemd, udev, openssh-server, dbus. NO kernel,
# NO board/BSP packages, NO GStreamer, NO libsrt, NO cerastream/srtla/CeraUI —
# those all belong to the platform/runtime/app layers, never the base.

[Output]
Format=directory

[Content]
# Deny service starts for the WHOLE build. A skeleton tree is copied in BEFORE the
# distribution's package manager runs, which is the only placement that covers the
# base layer's own bootstrap transaction — an ExtraTree or a postinst would arrive
# after the noise (census rows 8, 9 and 21) had already been emitted. The upper
# layers inherit it through BaseTrees=%O/base, and the app layer deletes it before
# the rootfs is emitted (app/mkosi.postinst.chroot::remove_chroot_service_policy).
# Declared explicitly rather than left to mkosi's mkosi.skeleton auto-detection so
# a rename fails loudly instead of silently reintroducing the noise.
SkeletonTrees=mkosi.skeleton
# BaseTrees= layering REQUIREMENT (mkosi man, BaseTrees=): a tree used as a base
# must still carry the package-manager databases + repo metadata, otherwise the
# platform/runtime layers stacked on top cannot resolve/install their extra
# packages. `auto` would strip them (apt is present) → keep them explicitly so
# `mkosi.images/platform` (BaseTrees=%O/base) can `mkosi-install` the BSP and
# `mkosi.images/runtime` (BaseTrees=%O/platform) can install the product set.
CleanPackageMetadata=no
# Minimal base package set — the irreducible foundation. Nothing board- or
# app-specific here.
#
# apt + ca-certificates are load-bearing in the base (not optional): platform's
# `mkosi-install` wrapper delegates to apt with mkosi's authenticated local BSP
# repository, while runtime uses apt for the shared.list product set. mkosi's
# Debian bootstrap does NOT pull apt (it is priority "important", not
# "essential"), and the base comment above about keeping apt metadata is only
# meaningful if the apt client itself is present. ca-certificates must also be
# available before later HTTPS package operations.
Packages=
        systemd
        udev
        openssh-server
        dbus
        apt
        ca-certificates
        kmod
# Bootability (bootloader/UKI) is added by the platform layer + assembly step,
# not the base. The base is just a rootfs tree.
Bootable=no
# Appliance image: docs and man pages do NOT ship — but they are removed at the
# FINAL app layer (app/mkosi.postinst.chroot::prune_final_image_payload), not
# excluded here.
#
# WithDocs=no makes mkosi pass `--path-exclude=/usr/share/man/*` to dpkg, which
# deletes the man pages BEFORE the packages that own them are configured. Several
# Debian maintainer scripts register a man page as an update-alternatives slave in
# that same configure step, so the excluded file is missing exactly when
# update-alternatives looks for it: a real build emitted 13
# `update-alternatives: warning: skip creation of … doesn't exist` lines plus a
# hard `update-alternatives: error: alternative path
# /usr/share/man/man7/bash-builtins.7.gz doesn't exist` (census rows 5 and 6).
# The alternatives DATABASE is then wrong in the shipped image, not just noisy.
#
# Installing the docs and pruning them once at the end costs transient build
# space and leaves the final rootfs byte-equivalent.
WithDocs=yes
# Single-locale appliance (Task 19). The device speaks ONLY C.UTF-8 — there is no
# interactive shell user picking a language, and CeraUI is its own web frontend.
# Locale=/LocaleMessages= pin /etc/locale.conf to C.UTF-8 (glibc 2.36 ships C.UTF-8
# built-in, so NO locale-gen / locale-archive is needed). RemoveFiles then purges
# every gettext message catalog (/usr/share/locale/*) and any stale compiled
# locale-archive that a transitively-pulled `locales` package might have left —
# C.UTF-8 keeps working because it carries no .mo catalog (programs fall back to
# their built-in English msgids). Each upper layer repeats the RemoveFiles glob so
# catalogs shipped by ITS new packages are stripped too (RemoveFiles runs per-image
# at the end of that image's build). See docs/size-notes.md.
Locale=C.UTF-8
LocaleMessages=C.UTF-8
RemoveFiles=/usr/share/locale/*,/usr/lib/locale/locale-archive
# Create the CeraLive runtime USER in the BASE OS layer. The sysext app layer
# (task 22) overlays only /usr+/opt and cannot add a user, so the `ceralive`
# account must exist in the sealed base tree before the app extension runs as
# it. mkosi.finalize stages mkosi/customize + lib/common.sh into the tree and
# runs `customize/run-all.sh base` (→ users.sh) via mkosi-chroot.
FinalizeScripts=mkosi.finalize
