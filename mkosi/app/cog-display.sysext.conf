# CeraLive v2 — cog-display feature sysext descriptor (Stage 5, task 36).
#
# Declarative build recipe for the Cog + WPE WebKit single-window kiosk browser
# shipped as an OPTIONAL display-engine add-on (a lighter alternative to the
# cage + Chromium kiosk chassis in docs/kiosk-display.md). The authoritative
# packaging spec is docs/cog-display-addon.md; the runtime-facing descriptor
# CeraUI reads at install time is manifests/addons/cog-display.json.
#
# HOW THIS DIFFERS FROM srtla.sysext.conf
#   The first-party app sysexts are built from a SINGLE first-party .deb by
#   sysext-build.lib.sh (SYSEXT_DEB_PACKAGE). Cog instead is assembled from a
#   Debian apt CLOSURE (trixie main/arm64 — A1) into a staging tree, which is
#   then handed to lib/build-feature-sysext.sh to produce a SIGNED per-board/
#   per-OS artifact:  cog-display-<board>-<os_version>.raw  (+ .raw.sha256 +
#   .raw.sig, gpgv-verifiable against the image-baked add-on PUBLIC keyring).
#
# HARDWARE GATE (honest caveat)
#   The real apt-closure build + render QA require a physical RK3588 (Task 1
#   spike: NO-GO). This file is therefore a SCAFFOLD/recipe: it documents exactly
#   what the closure build must download, exclude, and assert. The build+sign
#   pipeline itself is proven against a STUB staging tree (see
#   test-results/task-36-cog-sysext.txt); the production payload lands only after
#   the hardware render-QA gate clears (cog-display-addon.md §7, TD-C4).
#
# KEY=value only (no logic / no side effects — documentation scaffold).
# shellcheck shell=bash
# shellcheck disable=SC2034  # consumed externally / scaffold; not all keys read yet

# Extension identity → cog-display-<board>-<os>.raw and extension-release.cog-display.
SYSEXT_NAME=cog-display

# Per-board artifacts this recipe produces. The Cog .raw PAYLOAD is identical
# across both RK3588 boards — same SoC, same GPU, same arm64 userspace. The
# per-board NAME is the build-feature-sysext.sh contract
# (<feature>-<board>-<os>.raw); the runtime descriptor's urlTemplate addresses
# them via its {board}+{os_version} tokens.
SYSEXT_BOARD_VARIANTS="rock-5b-plus orange-pi-5-plus"

# ACQUISITION (A1): apt closure from Debian trixie main/arm64 — NOT a first-party
# .deb, NOT a backport, NOT a third-party repo. Resolved+downloaded into a staging
# dir per cog-display-addon.md §4.1 (apt-get install --download-only cog), then
# squashed.
#
# TRIXIE FLIP — the renderer package was RENAMED, it was not merely bumped, and a
# name-only edit of the old pins resolves to NOTHING on trixie:
#   libwpewebkit-1.1-0 -> libwpewebkit-2.0-1   (WPE API 1.1 retired; 2.48.3-1)
#   libicu72           -> libicu76             (76.1-4)
#   libopenjp2-7       -> dropped              (WPE 2.48 image codecs are
#                                               libjxl0.11 + libavif16 + the
#                                               libwebp demux/mux pair)
# Measured against the REAL trixie arm64 index, not a web lookup:
#   cog                 0.18.4-1+b1   (was 0.16.1-1 on bookworm)   # suite-literal-ok: names the RETIRED suite whose pins this line replaces — the negative control for the flip
#   libwpewebkit-2.0-1  2.48.3-1      (was libwpewebkit-1.1-0 2.38.6-1)
#   cage                0.2.0-2
# Note 2.48.3, NOT the 2.44.x the pre-migration doc forecast: trixie shipped a
# newer WebKit than that forecast, and the forecast was never re-checked against
# the archive. Versions are pinned in versions.yaml only
# AFTER render QA passes (TD-C1).
#
#   cog          single-window WPE WebKit kiosk browser (the launcher)
#   wpewebkit    libwpewebkit-2.0-1 — the renderer (dominant size term)
#   cage         Wayland compositor (Cog's `wl` platform; direct-DRM mode skips it)
#   mesa/llvm    the Panthor GPU userspace half — see SYSEXT_BOARD_GPU_USERSPACE
# The remaining names are cog's hard runtime closure MINUS what the Runtime OS
# layer already merges (GStreamer/glib/cairo/fontconfig/freetype — shared.list).
SYSEXT_APT_PACKAGES="cog libwpewebkit-2.0-1 libwpe-1.0-1 libwpebackend-fdo-1.0-1 libsoup-3.0-0 libicu76 libepoxy0 libharfbuzz-icu0 libmanette-0.2-0 libwebp7 libwebpdemux2 libwebpmux3 libwoff1 libjxl0.11 libavif16 liblcms2-2 cage libwayland-client0 libwayland-server0 libwayland-egl1 libgles2 mesa-libgallium libgl1-mesa-dri libllvm19 libz3-4"

# Binaries that MUST resolve after extraction+prune, or the build fails loudly.
SYSEXT_REQUIRED_BINARIES="usr/bin/cog usr/bin/cage"

# Platform/Runtime-owned shared objects that must NEVER ship in this sysext
# (matched by BASENAME anywhere in the extracted tree; the build fails if any
# survives the prune).
#   libmali*                         RETIRED vendor Mali-G610 userspace. It is
#                                    excluded here for a STRONGER reason than
#                                    before: on the trixie/mainline path there is
#                                    no libmali on the device at all (it is off
#                                    the edge variant's firmware_packages), and
#                                    the vendor blob is ABI-incompatible with
#                                    trixie's stack (armbian/build#10320). A copy
#                                    smuggled in here would shadow Mesa's GBM/EGL
#                                    and break Panthor init.
#   libEGL.so*/libgbm.so*            Debian GLVND + Mesa, ALREADY INSTALLED and
#                                    NOT pruned in the Runtime layer (libegl1,
#                                    libegl-mesa0, libgbm1 all arrive with
#                                    gstreamer1.0-plugins-bad). Base-owned.
#   librockchip_mpp.so*/             Platform HW-accel userspace (defensive; the
#   librockchip_vpu.so*/             identical contract the srtla sysext enforces).
#   libgstrockchip*/gstreamer1.0-rockchip*
#
# DELIBERATELY NO LONGER EXCLUDED — libGLESv2.so*, libGLESv1*.so*,
# libwayland-egl.so*. Those three globs existed for exactly ONE reason: libmali
# supplied those sonames on-device, so a bundled copy would shadow the vendor
# blob. With libmali gone the premise is inverted — the Runtime layer supplies
# NEITHER `libgles2` NOR `libwayland-egl1`, so keeping the globs would silently
# delete libraries nothing else provides and leave a kiosk with no GLES at all.
SYSEXT_EXCLUDE_NAMES="libmali.so* libmali-*.so* libEGL.so* libgbm.so* librockchip_mpp.so* librockchip_vpu.so* libgstrockchip*.so* gstreamer1.0-rockchip*"

# GPU STACK — Panthor (kernel) + Mesa (userspace). EMPTY on purpose.
#
# This key used to name the per-board Platform-layer Mali blob
# (libmali-valhall-g610-g24p0-wayland-gbm). On the trixie/mainline path there is
# no such package: the mainline kernel binds the Mali-G610 (a Valhall CSF part)
# with the in-tree open `panthor` DRM driver, and its userspace is Mesa's
# Gallium `panthor`/`panfrost` driver. Both are verified, not assumed:
#   * kernel  — CONFIG_DRM_PANTHOR=m survives in the REAL resolved v7.2 edge
#               config (rk3588-kernel-patches .omo/evidence/v72-rebase/
#               05-compile/resolved.config), and is now pinned in
#               manifests/kernel/required-symbols.list so it can never be
#               dropped in silence.
#   * userspace — trixie arm64 ships dri/panthor_dri.so AND dri/panfrost_dri.so,
#               both symlinks onto libdril_dri.so, whose driver code lives in
#               mesa-libgallium's libgallium-<version>.so.
#
# WHY THE MESA HALF RIDES IN THIS SYSEXT AND NOT IN THE BASE IMAGE. The Runtime
# layer INSTALLS mesa-libgallium/libgl1-mesa-dri/libllvm19/libz3-4 and then
# RemoveFiles=-prunes exactly four globs from them — libgallium-*.so,
# libLLVM*.so*, libz3.so*, dri/*_dri.so — for 185,262,968 B. That prune is what
# keeps both RK3588 boards under the 1.5 GB [6c/9] gate, and it stays: no base
# image has any GL consumer. The kiosk add-on is the ONLY one, it is optional and
# inert by default, so it carries its own copy of precisely those four pruned
# globs. Nothing is shadowed — the base has no file at those paths — and the
# production image is byte-unchanged. libLLVM+libz3 ride along because they are
# not optional: `objdump -p libgallium-*.so` shows a hard DT_NEEDED on
# libLLVM.so.19.1 (llvmpipe is compiled into the same megadriver), so a
# libgallium without them cannot be dlopen()ed at all.
#
# The rejected alternative, recorded with its number: un-pruning the base on the
# mainline path costs +185 MB, which puts the edge image at ~1.62 GB against a
# 1.5 GB ceiling no board may raise.
SYSEXT_BOARD_GPU_USERSPACE=""

# This is the WPE WebKit engine, NOT Chromium. Recorded so a future closure edit
# can never silently drag Chromium (or a retired libmali blob) into the add-on
# payload.
SYSEXT_FORBID_PACKAGES="chromium chromium-common libmali-valhall-g610"

# extension-release matching identity (G1). build-feature-sysext.sh re-asserts
# SYSEXT_LEVEL=1 + the VERSION_ID by reading them BACK out of the produced
# squashfs — these are the merge keys the kernel uses, so the VERSION_ID comes
# from the ONE target-release mapping (manifests/target-release.env ->
# OS_VERSION_ID) and is never written as a literal.
SYSEXT_OS_ID=debian
SYSEXT_OS_VERSION_ID="${OS_VERSION_ID:?OS_VERSION_ID must be loaded from manifests/target-release.env before sourcing this descriptor}"
SYSEXT_LEVEL=1
