[Unit]
# Ordering half of the PipeWire seam. `Wants=`, deliberately NEVER `Requires=`:
# cerastream's shipped default is `[audio] backend = "alsa"`, which never opens a
# PipeWire client at all, so binding the stream engine's fate to a daemon it may not
# use would turn the ALSA rollback hatch into a liability. `After=pipewire.socket` is
# the edge that matters — the socket unit binds its listener before the daemon is
# executed, so this genuinely means "connectable", unlike After= on a Type=simple
# service. The units themselves also carry `Before=cerastream.service`; both
# directions are stated because a drop-in on a package-owned unit and a first-party
# unit can be installed independently of each other.
Wants=pipewire.socket wireplumber.service
After=pipewire.socket wireplumber.service

[Service]
# THE OTHER HALF OF THE SOCKET PATH, and without it the engine looks in the wrong
# place. A PipeWire client resolves its socket from PIPEWIRE_RUNTIME_DIR, then
# XDG_RUNTIME_DIR, then USERPROFILE. A system service has none of those, so it would
# fall through to no runtime directory at all and fail to connect — while the daemon
# sits perfectly healthy on /run/pipewire/pipewire-0.
#
# Harmless on the ALSA arm: the variable is only ever read when a PipeWire client is
# created, so it costs an unconfigured board nothing.
Environment=PIPEWIRE_RUNTIME_DIR=/run/pipewire
