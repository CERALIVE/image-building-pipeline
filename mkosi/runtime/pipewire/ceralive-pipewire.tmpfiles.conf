# /etc/tmpfiles.d/ceralive-pipewire.conf — the system-mode PipeWire runtime dir.
#
# THE ACCESS BOUNDARY IS THIS ONE LINE, and it is declared here rather than as a
# RuntimeDirectory= on each unit for a reason: pipewire.socket, pipewire.service and
# wireplumber.service all need the directory, and three RuntimeDirectory= /
# RuntimeDirectoryMode= pairs are three places for the mode to drift. systemd-tmpfiles
# runs before sockets.target, so the directory exists before anything binds into it.
#
# 0750 pipewire:pipewire, NOT 0755 and NOT root-owned:
#   * systemd would otherwise create the ListenStream= parent itself, root-owned and
#     world-traversable, which is a strictly weaker boundary than the socket's own
#     0660 mode implies.
#   * root (cerastream.service) traverses it regardless — that is what admits the
#     engine with no extra grant.
#   * every OTHER unprivileged process on the board is kept out of the media graph,
#     which is the point: a PipeWire client can enumerate and open the operator's
#     capture devices.
d /run/pipewire 0750 pipewire pipewire -
