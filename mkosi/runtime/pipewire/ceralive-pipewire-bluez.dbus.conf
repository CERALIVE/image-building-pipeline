<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  /etc/dbus-1/system.d/ceralive-pipewire-bluez.conf

  WirePlumber's BlueZ monitor runs as the dedicated `pipewire` system user, not as
  root, and it registers a media endpoint with bluetoothd over the SYSTEM bus. This
  narrow policy is what makes that reachable without granting the daemon root.

  SCOPED THREE WAYS ON PURPOSE:
    * user="pipewire"          — this policy applies to nothing else on the board.
    * send_destination="org.bluez" — it can address bluetoothd and no other service.
    * no <allow own=.../>      — it may not claim a bus name; it is a client only.

  Debian's own bluetooth.conf already grants a default-context `send_destination`
  for org.bluez, so on today's trixie this file is belt-and-braces rather than the
  only thing standing between the daemon and BlueZ. It is shipped anyway because the
  alternative — depending on a default policy that upstream tightens on its own
  schedule — is exactly the kind of silent, boot-time-only failure this repository
  keeps paying for elsewhere. If BlueZ narrows its defaults, this file is why
  Bluetooth capture keeps working.
-->
<busconfig>
  <policy user="pipewire">
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.Media1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.MediaEndpoint1"/>
    <allow send_destination="org.bluez" send_interface="org.bluez.MediaTransport1"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_destination="org.bluez" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
