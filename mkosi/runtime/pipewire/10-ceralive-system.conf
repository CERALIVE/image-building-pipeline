# /etc/pipewire/pipewire.conf.d/10-ceralive-system.conf
#
# CeraLive's system-mode PipeWire daemon settings. A DROP-IN, never a replacement:
# pipewire.conf(5) says the main file "contains various parts that must be present
# for correct functioning, [so] using drop-in files for configuration is
# recommended". Dictionary sections here MERGE into the shipped defaults.
#
# DO NOT ADD A `context.modules` BLOCK HERE. Drop-in ARRAY sections are APPENDED,
# not merged — re-declaring libpipewire-module-rt to set its rt.prio would load the
# module a SECOND time rather than reconfigure the first. Real-time scheduling is
# granted by pipewire.service's LimitRTPRIO=/LimitRTTIME=/LimitNICE=, which is where
# module-rt's defaults are already matched.
#
# DO NOT ADD A `context.exec` BLOCK HERE either. The session manager is
# wireplumber.service; pipewire.conf(5) calls starting it from context.exec a
# "development aid" to be avoided in production, and ADR-0010 §3 pins that.

context.properties = {
    # This process manages and schedules the graph for clients, and its socket name
    # is the other half of the path pipewire.socket binds and the cerastream drop-in
    # points PIPEWIRE_RUNTIME_DIR at. Changing one alone splits client from server.
    core.daemon = true
    core.name   = pipewire-0

    # No session bus exists on a headless appliance. Disabling D-Bus in the DAEMON
    # stops it attempting an rtkit lookup and a device reservation that can only
    # fail. This is the daemon's own connection only — WirePlumber's BlueZ monitor
    # runs in a different process and keeps its SYSTEM bus access.
    support.dbus = false

    # ADR-0010 compatibility contract item 1: capture stays S16LE / 48000 Hz /
    # stereo. Pinning the graph rate and refusing alternates keeps the backend swap
    # from quietly becoming a format change — the audio-level dB math and CeraUI's
    # meter are both computed over that format.
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]

    mem.allow-mlock = true
    log.level       = 2
}

# NO NETWORK AND NO ZEROCONF DISCOVERY MODULES ARE LOADED.
#
# The configuration half of that is negative — pipewire-pulse, pipewire-jack and any
# zeroconf package are absent from manifests/packages/shared.list, and no module is
# named here. A promise made only by omission is weak, so pipewire.service backs it
# structurally: RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_BLUETOOTH plus
# IPAddressDeny=any mean an RTP/RAOP/zeroconf module could not open a socket even if
# a future drop-in loaded it.
