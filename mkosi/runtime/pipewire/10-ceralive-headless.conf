# /etc/wireplumber/wireplumber.conf.d/10-ceralive-headless.conf
#
# THE HEADLESS PROFILE. Every line below turns OFF a WirePlumber feature that assumes
# a desktop: a login session, a seat, a session bus, a portal, a notification daemon.
# This board has none of them, and upstream says so in as many words about the first
# one — of `support.dbus`: "On a system where WirePlumber is configured to run
# system-wide (headless, embedded, etc), this will most likely fail to load and thus
# disable all the other support features that require it. On such systems it makes
# sense to disable this feature explicitly, to avoid the overhead of trying to
# connect to the session bus."
#   https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/features.html
#
# `disabled` is also the FAIL-SAFE direction across versions: a profile entry naming
# a feature this WirePlumber does not have is inert, whereas `required` on a missing
# feature is fatal. So this fragment cannot break a future version by naming one
# feature too many — only by naming one too few.
#
# THIS IS THE 0.5 CONFIG SYSTEM, NOT A 0.4 FRAGMENT PORTED FORWARD. WirePlumber 0.4
# configured itself through Lua (`alsa_monitor.rules`, `bluez_monitor.rules`,
# `.lua` files under /etc/wireplumber/*.lua.d/); 0.5 replaced all of it with SPA-JSON
# `wireplumber.profiles` + `<component>.rules` sections in `.conf` drop-ins. Every
# section below is a 0.5 section name read back off the SHIPPED trixie WirePlumber
# 0.5.8 (`monitor.alsa.rules` at scripts/monitors/alsa.lua:17,
# `monitor.bluez.rules` at scripts/monitors/bluez.lua:18, and
# `device.profile.priority.rules` at scripts/device/find-preferred-profile.lua:14,
# all consumed through
# `JsonUtils.match_rules_update_properties`). There is no Lua here, and there must
# never be: a 0.4-era `alsa_monitor.rules` block in this file would be read by
# nothing at all and would fail SILENTLY — the exact shape of a dead writer.
#
# ONE FRAGMENT, and that is deliberate. /etc/wireplumber/wireplumber.conf.d/ holds
# this file and nothing else; the distro's own /usr/share/.../alsa-vm.conf is a
# separate, additive drop-in and is untouched. A second CeraLive fragment would split
# the headless profile from the rules that depend on it across two files that merge
# by filename order.

wireplumber.profiles = {
  main = {
    # --- Session-bus things that cannot exist here -------------------------
    # support.dbus is the SESSION bus. The BlueZ monitor's SYSTEM bus connection is
    # a separate SPA support handle and is NOT disabled by this.
    support.dbus                   = disabled
    # Requires support.dbus: the org.freedesktop.ReserveDevice1 protocol, whose whole
    # purpose is arbitrating a card between DESKTOP sound servers. There is exactly
    # one sound server on this image, by construction (ADR-0010 BT exclusivity).
    support.reserve-device         = disabled
    monitor.alsa.reserve-device    = disabled
    support.portal-permissionstore = disabled
    support.mpris                  = disabled
    api.notifications              = disabled

    # --- Seat / logind -----------------------------------------------------
    # There is no seat, so "enable devices only on the ACTIVE seat" resolves to
    # "enable devices on no seat" — i.e. it would make Bluetooth capture unreachable
    # on exactly the device that needs it.
    support.logind                 = disabled
    monitor.bluez.seat-monitoring  = disabled

    # --- What stays ON, and why it is not listed above ----------------------
    # monitor.alsa   — the capture cards the meter sidecar and the program leg share.
    # monitor.bluez  — PipeWire's BlueZ backend, the replacement for the retired
    #                  bluez-alsa/bluealsad provider (ADR-0010 "BT manager
    #                  exclusivity"). A Bluetooth microphone reaches cerastream as an
    #                  ordinary node with a node.name and no api.alsa.* property.
    # policy.standard — device enabling and client permissions.

    # --- Video is cerastream's, not WirePlumber's --------------------------
    # The engine drives capture through libuvc and v4l2src and holds the node for the
    # life of a leg; a second enumerator that opens the same /dev/videoN is a second
    # claimant on a device the engine already treats as exclusively held. cerastream
    # additionally scopes its PipeWire arm to AUDIO devices only, so a video node here
    # would be enumerated and then ignored — cost with no consumer.
    hardware.video-capture         = disabled
    monitor.v4l2                   = disabled
    monitor.libcamera              = disabled

    # --- MIDI is not a CeraLive concern ------------------------------------
    monitor.alsa-midi              = disabled
    monitor.bluez-midi             = disabled
  }
}

# ===========================================================================
# A CAPTURE NODE IS NEVER SUSPENDED.
#
# WirePlumber suspends an idle node after a timeout — scripts/node/suspend-node.lua
# on the shipped 0.5.8:
#
#     local timeout =
#         tonumber(node.properties["session.suspend-timeout-seconds"]) or 5
#     if timeout == 0 then
#       return
#     end
#
# so the DEFAULT is 5 seconds and the value `0` is read as "never", by an early
# return before any timer is armed. That is the mechanism these rules use; it is not
# an "immediately" value and it is not a disabled feature.
#
# Why capture must opt out, on this device specifically:
#
#   · The always-on audio meter (ADR-0007 §10) demotes a candidate that owns its
#     sidecar for 2 s without DELIVERING a sample. A node that went to suspend while
#     nothing held it has to resume before it can clock one, and the resume is the
#     driver's to schedule — so a suspend/resume round trip inside that window reads
#     to the engine as a dead microphone and the operator's card is demoted.
#   · The engine opens the SAME target twice (idle sidecar + program leg). PipeWire
#     multiplexing that pair is the entire reason ADR-0010 chose it; a suspend in the
#     gap between the two opens re-negotiates the device underneath them.
#   · An HDMI-RX capture is a receiver, not a microphone. Its ALSA device stays
#     registered with no cable attached, so it idles for long stretches by design and
#     is exactly the node a 5 s timeout would suspend most often.
#
# SINKS ARE DELIBERATELY LEFT ALONE. The board's analog output has no CeraLive
# consumer, and keeping the stock 5 s suspend on it is what stops this rule becoming
# "pin every audio device open forever". Matching is therefore on `media.class`,
# which alsa.lua sets (line ~228) and bluez's node path publishes BEFORE rules are
# applied — the semantic "this is a capture node", rather than a name glob that a
# split PCM or a future naming change could slip past. The `node.name` alternatives
# are a second, independent match object for the same reason a candidate list exists
# elsewhere in this stack: one key going missing must not silently disable the rule.

monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Source"
      }
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      {
        media.class = "Audio/Source"
      }
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# ===========================================================================
# THE HDMI-RX CAPTURE CARD IS SELECTED DETERMINISTICALLY WHENEVER ACP DESCRIBED A
# REAL INPUT PROFILE — and is deliberately left to park at `off` when ACP described
# nothing at all. Read the ordered-list section below before changing either half.
#
# An ACP profile set is built ONCE, when the device object is created, from what the
# card could describe AT THAT INSTANT. The HDMI-RX sound card is a bare
# `simple-audio-card` bridging one capture-only I2S DAI, so what it can describe
# depends on whether the receiver's audio domain was carrying anything when the card
# was probed — and on a board that powers up with no HDMI audio yet, it can describe
# nothing. Read off a live OPi 5+ (7.2.0-ceralive-rk3588, WirePlumber 0.5.8-2), the
# SAME device (`alsa_card.platform-hdmi-receiver-sound`, `alsa.id=HDMIIN`) enumerated
# two different profile sets on two different probes:
#
#   probed 5.3 s after boot, no HDMI audio  ->  off(prio 0, avail yes)
#                                               pro-audio(prio 1, avail yes)
#   re-probed with real HDMI audio present  ->  off(prio 0, avail yes)
#                                               input:stereo-fallback(prio 51, unknown)
#                                               pro-audio(prio 1, avail yes)
#
# In the SECOND set `scripts/device/find-best-profile.lua` does the right thing on its
# own: `input:stereo-fallback` has `available != "no"`, so it wins on priority. In the
# FIRST set that chooser cannot pick anything usable at all, because it EXCLUDES
# `pro-audio` by name:
#
#     elseif profile and profile.name ~= "pro-audio" then
#
# so `best_profile` and `unk_profile` both stay nil, the fallback chain reaches
# `off_profile`, and the card is parked at `off`. Nothing re-enumerates it afterwards,
# so that verdict stands for the whole uptime EVEN ONCE AUDIO ARRIVES. A device at
# profile `off` publishes no node, and the engine addresses a card through its node's
# `alsa.id` — so `list-devices` loses `hw:CARD=HDMIIN` entirely and a `start` naming it
# is refused with the frozen typed prefix
# `audio-device-unavailable: PipeWire capture device 'hw:CARD=HDMIIN' ...`.
# Reproduced deterministically by forcing this card to profile 0 and re-running the
# real engine RPC; the kernel side is uninvolved throughout (card 4 and its capture PCM
# stay present and idle, and the ALSA backend opens that same PCM successfully in the
# very same state).
#
# `device.profile.priority.rules` is upstream's own documented override and the only
# mechanism that reaches this. `scripts/device/find-preferred-profile.lua` reads this
# section, runs `before = "device/find-best-profile"`, and selects the first listed
# profile the device actually enumerates — with no `pro-audio` exclusion. It matches
# against the LIVE `device.properties`, which is why `alsa.id` is a usable key here
# even though it is absent from the earlier device-creation props.
#
# THE LIST HOLDS EXACTLY ONE ENTRY, AND THE MISSING SECOND ONE IS THE POINT:
#
#   `input:stereo-fallback` is the ONLY entry. When ACP produced a real input profile
#       this rule selects exactly what find-best-profile would have selected anyway —
#       verified on hardware: with this rule installed the node stayed
#       `alsa_input.platform-hdmi-receiver-sound.stereo-fallback`, 2ch/48 kHz, and the
#       engine roster was unchanged. That is the half of PR #180 that was ever proven,
#       and it is preserved bit-for-bit.
#
#   `pro-audio` WAS a second entry, as a FLOOR for the degraded set, AND IT IS
#   REMOVED. It cost a board its engine every ~66 minutes. Measured on a Rock 5B+ on
#   2026-09-20 (`.omo/evidence/task-35-rock-fd-leak-fix-*`), with no HDMI source
#   attached — which is the normal idle state of a device waiting for a camera:
#
#     · The floor selects `pro-audio`, which publishes
#       `alsa_input.platform-hdmi-receiver-sound.pro-input-0` as an `Audio/Source`.
#     · With no signal the I2S capture PCM cannot `set_hw_params` — the driver
#       answers ENOLINK, `spa.alsa` logs `set_hw_params: Link has been severed`, and
#       the node goes `suspended -> error (Start error: Link has been severed)`. It
#       is a node that exists and can never start.
#     · cerastream enumerates it as a third audio device and its always-on meter
#       targets it (`target.object=…pro-input-0`). The link fails
#       (`pw.link: one of the nodes is in error`), the sidecar never delivers, and
#       the engine builds a NEW `Stream/Input/Audio` node every 30.2 s and never
#       destroys the previous one — its `meter_alsasrc:src` GStreamer task threads
#       accumulate one per cycle, stuck in `futex_do_wait`, so the pipeline never
#       reaches NULL and is abandoned along with its PipeWire stream.
#     · Cost: +1 leaked node, +1 leaked thread and +8..9 file descriptors every
#       30 s — **+15.6 fds/min measured, idle** — against the engine unit's default
#       soft `RLIMIT_NOFILE` of 1024. At ~66 minutes MPP's `dma_heap` allocation
#       hits `EMFILE`, the pipeline errors `not-negotiated`, frames stop, and the
#       90 s watchdog SIGABRTs `cerastream`.
#
#   Three arms isolated it, on ONE board, ONE engine binary (`cerastream 2026.9.5`)
#   and ONE image, so the variable is this list and nothing else:
#
#     rule with the `pro-audio` floor        node in `error`   +15.6 fds/min
#     rule without it (this file)            no node at all     0.0 fds/min, flat
#     rule without it + profile forced by
#       hand to `pro-audio` via pw-cli       node in `error`   +18.3 fds/min
#
#   The third arm is what makes this a mechanism rather than a correlation: the
#   leak follows the ERRORED NODE, not the text of this file. Production slot B,
#   which has never carried this rule, sat flat at 49 fds for 2 h 30 m.
#
#   THE HONEST TRADE, stated rather than buried. Removing the floor restores PR
#   #180's original defect IN THE DEGRADED SET ONLY: a board probed with no HDMI
#   audio parks the card at `off`, publishes no node, and `hw:CARD=HDMIIN`
#   disappears from `list-devices` until something re-enumerates the card. That is
#   an operator-visible limitation. It is strictly better than the alternative,
#   because the floor's benefit in that same degraded set was never demonstrated —
#   the node it publishes cannot start without a signal — while its cost is a
#   proven fleet-wide engine death on any board left idle for an hour.
#
#   WHAT WOULD LET THE FLOOR COME BACK, so this is not a permanent verdict on the
#   idea: cerastream must stop leaking a whole pipeline per failed sidecar open
#   (bound or quarantine the un-releasable `MeterSidecarPipeline` instead of
#   abandoning it, and stop re-creating a sidecar for a target that has repeatedly
#   failed). Once an errored capture node costs a constant rather than a linear
#   number of descriptors, a floor can be reconsidered — ideally alongside real
#   evidence that a `pro-audio` HDMI-RX node starts and delivers once a signal
#   arrives, which has never been measured. Do not restore it before both.
#
# THE MATCH IS THREE ALTERNATIVES, AND `matches` OR-s THEM — the same "one key going
# missing must not silently disable the rule" shape the capture suspend rules above
# use. `alsa.id` is the driver-supplied ALSA card id and is also the vocabulary the
# engine persists selections in (`hw:CARD=HDMIIN`); the two `device.name` alternatives
# cover both device-tree spellings of the sound node seen across boards and kernels.
# The scope is deliberately narrow: the analog card (`alsa_card.platform-sound`) and
# the two HDMI TRANSMITTER cards (`platform-hdmi0-sound`, `platform-hdmi1-sound`) match
# none of the three and keep whatever the automatic policy picks for them.

device.profile.priority.rules = [
  {
    matches = [
      {
        alsa.id = "HDMIIN"
      }
      {
        device.name = "~alsa_card.platform-hdmi-receiver-sound.*"
      }
      {
        device.name = "~alsa_card.platform-hdmirx-sound.*"
      }
    ]
    actions = {
      update-props = {
        priorities = [ "input:stereo-fallback" ]
      }
    }
  }
]

# ===========================================================================
# TWO THINGS THIS FRAGMENT DELIBERATELY DOES NOT CONFIGURE, AND WHY.
#
# 1. NODE NAMING. cerastream addresses a PipeWire capture node by `node.name`
#    (`pipewiresrc target-object=`), and persists that name — `object.serial` is
#    re-issued per node creation, so it is accepted as a live target and never
#    written down (crates/cerastream-core/src/sources/pw_identity.rs). A name that
#    moved between boots would therefore strand every saved audio selection.
#
#    It does not move, and the reason is upstream rather than local:
#    alsa.lua builds `node.name` as
#    `alsa_input.<device.name minus its "alsa_card." prefix>.<profile>`, and
#    `device.name` is `alsa_card.<device.bus-path>` — a topology path, NOT the ALSA
#    card index. Read off a live board: card index 2 answers to
#    `alsa_input.platform-hdmirx-sound.stereo-fallback`, and a USB microphone answers
#    to its own `usb-…` bus path. Card indices reorder across boots and hotplug;
#    these names do not.
#
#    So there is nothing to pin here, and pinning it would be worse than nothing: an
#    `update-props` can only write a LITERAL, so a `node.name` rule is necessarily
#    per-device, and a per-device name in this file would drift from the hardware
#    the moment a board is re-fitted. The determinism is a property of the naming
#    ALGORITHM; the guard for it is the contract test, not a config line.
#
# 2. CAPTURE-DEVICE ACCESS FOR THE ENGINE. There is no permission rule here because
#    the access decision is not WirePlumber's. `cerastream.service` runs as root and
#    reaches the graph through /run/pipewire/pipewire-0 — a 0660 socket in a 0750
#    directory, owned by the `pipewire` user/group (pipewire.socket +
#    ceralive-pipewire.tmpfiles.conf), with PIPEWIRE_RUNTIME_DIR supplied by the
#    engine's own drop-in. The daemon then reaches the hardware through
#    SupplementaryGroups=audio against a `GROUP="audio" MODE="0664"` /dev/snd. Both
#    halves are unit/tmpfiles facts, asserted where they are declared.
#
#    What WirePlumber owes that path is `monitor.alsa` + `monitor.bluez` +
#    `policy.standard` staying ENABLED — which is why the profile above disables
#    around them rather than through them, and why every entry it does disable is a
#    desktop-session feature with no capture consumer.
