[Unit]
Requires=ceralive-button-backend-fence.service
After=ceralive-button-backend-fence.service

[Service]
Environment=PORT=18080
# A busy backend port must fail startup rather than fall back to a public port.
SocketBindDeny=ipv4:tcp:80
SocketBindDeny=ipv6:tcp:80
SocketBindDeny=ipv4:tcp:81
SocketBindDeny=ipv6:tcp:81
SocketBindDeny=ipv4:tcp:8080
SocketBindDeny=ipv6:tcp:8080
RuntimeDirectory=ceralive-button-ingress
RuntimeDirectoryMode=0700
# systemd runs this only after the previous service process has exited.
ExecStartPre=/usr/bin/python3 /usr/local/lib/ceralive-button-ingress/cleanup.py
