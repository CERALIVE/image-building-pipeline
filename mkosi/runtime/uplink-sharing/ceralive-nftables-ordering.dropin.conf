[Unit]
# REQ-USB-025 — the CeraUI half of the carrier's ordering contract.
#
# ceralive-share.service already carries After=nftables.service, but that only
# orders the CARRIER. The unit is not enabled and never starts on its own: the
# CeraUI backend (ceralive.service) is what renders /run/ceralive/share.nft and
# then issues `systemctl start` / `reload` / `stop` on it. So ceralive.service is
# the unit that can actually race nftables.service — it can reach its steering
# reconciliation, start the carrier, and have nftables.service load the system
# ruleset on top of the table we just applied.
#
# ORDERING-ONLY, never Requires=, for the same reason
# 30-cerastream-ordering.conf gives: ceralive.service MUST still boot and serve
# its degraded state when a unit it orders after is absent or masked. On this
# image nftables.service is not enabled at all, and After= on a unit outside the
# boot transaction is a harmless no-op — so this drop-in costs nothing on a
# device that never loads a system ruleset, and closes the race on one that does.
#
# Additive drop-in on the ceralive.service unit shipped by the CeraUI .deb, like
# 10-data-persistence.conf, 20-paseto-public-key.conf and
# 30-cerastream-ordering.conf. Installed by
# postinst-lib.sh::setup_uplink_sharing_carrier to
# /etc/systemd/system/ceralive.service.d/40-nftables-ordering.conf.
After=nftables.service
