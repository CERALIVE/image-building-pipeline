# CeraLive journald retention — installed to
# /etc/systemd/journald.conf.d/10-ceralive-journal.conf by
# postinst-lib.sh::setup_journald_retention.
#
# WHY THIS EXISTS (measured on a shipped Rock 5B+, 2026-08-30):
#
#   journalctl --list-boots            -> ONE boot
#   journalctl -u NetworkManager       -> 6 lines, ~100 seconds of history
#   journalctl -u wpa_supplicant       -> EMPTY
#   journalctl -u ModemManager         -> "journal has been rotated since unit was started"
#
#   A device whose per-unit history is a hundred seconds long cannot be
#   diagnosed at all: every field report becomes "reproduce it while I watch".
#   Three things compounded — the journal had no explicit budget, so it was
#   sized against a /data partition that had already reached 98 % full; the
#   kernel audit stream was writing straight into the journal (144 of the last
#   ~350 records in a six-minute window were `audit:` lines); and nothing capped
#   how much of the budget one chatty unit could take.
#
# THE BUDGET IS AGAINST /data, NOT THE ROOTFS SLOT. /var/log is bind-mounted
# from /data/log (postinst.d/persistence.sh::setup_data_persistence), which is
# the flex partition — the ONLY one that survives an A/B slot swap and the one
# that is shared with the OTA download dir, the cert store and the CeraUI
# config. So the cap below is deliberately a small fraction of it: a journal
# that fills /data does not merely lose logs, it breaks OTA and config writes.
# SystemKeepFree is the second half of that argument and is the one that binds
# on an already-full partition, because journald honours whichever of the two
# limits is reached first.

[Journal]
# State the storage explicitly rather than inheriting `auto`, whose behaviour
# depends on whether /var/log/journal happens to exist at journald start — and
# on this image /var/log is a LATE bind mount, so "happens to exist" is a
# race rather than a policy.
Storage=persistent
Compress=yes

# The /data budget. 256 MiB is roughly half of what the board had already
# accumulated in /data/log by the time it was diagnosed, and ~4 % of the
# smallest data partition this contract admits.
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=32M
SystemMaxFiles=16
MaxRetentionSec=1month

# The volatile journal lives in /run (tmpfs = RAM) and is what carries early
# boot before the /var/log bind exists, so it is capped hard and separately.
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M

# PER-UNIT RATE LIMITING. journald applies these PER SERVICE (systemd-journald.conf(5):
# "this rate limiting is applied per-service"), so a single runaway unit can no
# longer consume the whole retention budget and evict every other unit's history
# — which is precisely how NetworkManager ended up with 6 lines. The burst is
# five times lower than the upstream default of 10000: normal units never come
# near it, and a unit that does is in a log loop rather than saying something.
RateLimitIntervalSec=30s
RateLimitBurst=2000

# The kernel audit stream is the single largest source of noise on this device
# and carries no diagnostic value for it: `auditd` is not installed, so the
# kernel prints straight into the journal. `Audit=no` stops journald ASKING the
# kernel to send it; it does not disable auditing for anything that configures
# it deliberately.
Audit=no

# No syslog daemon ships in this image, so forwarding is pure work with no
# reader. Console forwarding stays off for the same reason the serial console is
# a diagnostic surface rather than a log sink.
ForwardToSyslog=no
ForwardToWall=no
