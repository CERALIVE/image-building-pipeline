# CeraLive Image Family Manifest — Rockchip RK3588 / RK3588S
#
# Validates against ../schema/family.schema.json (draft 2020-12).
# Captures SoC/arch-level build attributes shared by every rk3588 board
# (Orange Pi 5+, Radxa Rock 5B+). Per-board variance lives in ../boards/*.yaml.
#
# DECISION D3 IS SUPERSEDED FOR THE KERNEL HALF. The production kernel is now
# the mainline 7.2 track built FROM SOURCE, selected by `default_variant: edge`
# below; the prebuilt Armbian vendor 6.1 BSP survives only behind the explicit
# `--variant vendor` overlay and is scheduled for removal. D3's OTHER half is
# unchanged and still locked: RAUC bootloader adapter = `custom`, because the
# staged U-Boot lacks persistent fw_setenv (FAT-file bootcount approach).
#
# Sources: configs/devices/{rock5bplus,orangepi5plus}.conf (BOARD_PACKAGES),
# userpatches/config-{rock5bplus,orangepi5plus}.conf (BRANCH=, EXTRA_BSP_PACKAGES),
# configs/base/ceraui-base.conf (STREAMING_PACKAGES HW path).

arch: arm64

# ---------------------------------------------------------------------------
# THE PRODUCTION KERNEL TRACK.
#
# A variant-less `./build <board>` resolves the `edge` overlay declared below —
# byte-identically to `./build <board> --variant edge`, board `variant_overrides`
# for `edge` included. So the mainline 7.2 source-built kernel is what ships, and
# the prebuilt vendor rows in the TOP-LEVEL fields under this block are no longer
# on the default path at all: they are the base every variant overlays, reachable
# as a resolved answer only through `--variant vendor`.
#
# WHY A POINTER AND NOT A COPY. Moving `edge`'s block up here would force
# `edge-test` (which `extends: edge`) to restate its parent's pins — the exact
# byte-for-byte drift `extends` exists to make impossible — and would deep-merge
# this file's defconfig mode onto `vendor-patched`'s config-file mode, producing
# the half-specified config `$defs/kernel_source`'s `oneOf` forbids and
# build-kernel.sh re-asserts. One declaration, one pin set, one answer.
# ---------------------------------------------------------------------------
default_variant: edge

# BRANCH= from userpatches/config-*.conf (both boards) — NOT the dead
# ARMBIAN_BRANCH=current in configs/devices/*.conf. This is the BASE value the
# `vendor` overlay keeps; the production `edge` overlay retargets it.
armbian_branch: vendor

# linux-image-* of BOARD_PACKAGES, resolved to the `vendor` branch. The Armbian
# bookworm arm64 vendor kernel for RK35xx SoCs ships as -rk35xx (the  # suite-literal-ok: ARMBIAN_SUITE, the BSP feed — orthogonal to the userspace RELEASE
# -rockchip64 name was a migration placeholder that doesn't exist in the feed).
# NOT on the default path — see `default_variant` above.
kernel_packages:
  - linux-image-vendor-rk35xx

# RK3588 U-Boot is BOARD-SPECIFIC in the Armbian feed (linux-u-boot-<board>-vendor),
# so the family declares none — each board names its own via the board manifest's
# uboot_packages override (board arrays REPLACE family arrays on deep-merge). The
# old rkbin-rk3588 entry was an internal placeholder; no such package exists in apt.
uboot_packages: []

# linux-dtb-* of BOARD_PACKAGES, resolved to the `vendor` branch. Matches the
# -rk35xx vendor kernel naming above (the -rockchip64 name was a placeholder).
# NOT on the default path either: the production `edge` overlay resolves
# dtb_packages: [] because `make bindeb-pkg` ships the in-tree DTBs inside the
# linux-image deb it builds.
dtb_packages:
  - linux-dtb-vendor-rk35xx

# Shared SoC/GPU/Wi-Fi firmware. armbian-firmware is the broad Armbian firmware
# bundle (ships realtek + broadcom WiFi blobs).
#
# Task 19 firmware-split audit — KEEP armbian-firmware, do NOT swap to the Debian
# split (firmware-realtek + firmware-brcm80211). Both rk3588 boards run the Armbian
# VENDOR kernel (Decision D3) whose out-of-tree WiFi/BT drivers expect Armbian's
# board-matched blobs AND per-board NVRAM config files:
#   * Rock 5B+   → RTL8852BE  (was rtl8852be-firmware + firmware-realtek)
#   * Orange Pi 5+ → AP6275P / brcmfmac (Broadcom)
# Debian's split packages target the MAINLINE in-tree drivers and omit the Armbian
# NVRAM (.txt) files, so a swap risks WiFi never associating on the vendor kernel.
# `armbian-firmware` is already the TRIMMED Armbian variant (NOT armbian-firmware-full),
# i.e. the narrowest safe lever available — there is no finer split that keeps the
# vendor-kernel WiFi/BT path intact. Size/feasibility detail: docs/size-notes.md.
#
# libmali IS NOT LISTED HERE, AND THAT PLACEMENT IS LOAD-BEARING — it is declared
# by the two VENDOR-kernel overlays instead. The Mali-G610 (Valhall) GPU userspace
# blob drives Rockchip's out-of-tree driver through /dev/mali0, which only a vendor
# kernel creates; the mainline track binds the same silicon with the in-tree open
# `panthor` DRM driver and Mesa. So it is a per-overlay fact, not a family one.
#
# Declaring it here anyway would NOT be merely untidy, because the fetch path
# unions this FILE's lists with the resolved env values (lib/fetch/bsp.sh
# ::collect_declared_bsp_pkgs). An overlay that resolves a strict SUBSET of a
# family list cannot remove a name that way, so the mainline default would still
# stage the blob's .deb — and then die at [3/9] as an "unclassified staged
# package", because the resolved FIRMWARE_PACKAGES that partitions the staging
# tree would not name it. Keep a family list to what EVERY track needs and let
# overlays ADD.
#
# The blob itself is NOT in the Armbian bookworm arm64 feed. It is pinned to an  # suite-literal-ok: names the Armbian BSP feed, not the target rootfs suite
# exact upstream release asset and SHA-256-verified in
# ../rk3588-userspace-deb-versions.txt (staged by fetch_rk3588_userspace, excluded
# from the Armbian fetch). The g24p0 wayland-gbm variant is the one the kiosk
# (cage = a Wayland compositor) needs — see docs/cog-display-addon.md §5. The
# GPU's CSF firmware blob rides armbian-firmware on BOTH tracks.
firmware_packages:
  - armbian-firmware

# Decision D3: vendor U-Boot has no fw_setenv → raw GPT bootcount approach.
rauc_bootloader_adapter: custom

# Hardware-accelerated GStreamer encode/decode (Rockchip MPP) feeding
# VIDEO_ENCODER/VIDEO_DECODER=rk3588_mpp. gstreamer1.0-rockchip1 registers
# mpph264enc/mpph265enc/mppjpegenc/mppvp8enc against the MPP runtime below — PROVEN
# on real Rock 5B+ hardware (ffprobe-verified raw H.264/H.265 HW encode). It is NOT
# in the Armbian bookworm arm64 feed; pinned + SHA-256-verified in  # suite-literal-ok: names the Armbian BSP feed, not the target rootfs suite
# ../rk3588-userspace-deb-versions.txt (radxa rk3588s2-bookworm build — tsukumijima  # suite-literal-ok: a third-party radxa pool NAME, pinned by URL+SHA-256
# publishes no gst-rockchip mirror). Staged by fetch_rk3588_userspace.
hw_accel_gstreamer_plugins:
  - gstreamer1.0-rockchip1

# Runtime multimedia support for the MPP HW-accel path. librockchip-mpp1 is the MPP
# encode/decode runtime the gst plugin dlopens; librga2 is the RGA 2D accelerator it
# links; rockchip-multimedia-config ships the udev/config glue. None are in the
# Armbian bookworm arm64 feed — all pinned + SHA-256-verified in  # suite-literal-ok: names the Armbian BSP feed, not the target rootfs suite
# ../rk3588-userspace-deb-versions.txt and staged by fetch_rk3588_userspace.
#
# librockchip-mpp-dev was HERE and is now removed — verdict `REMOVE`, recorded
# with its evidence in ../packages/removed.md and pinned by
# tests/mpp-dev-runtime-contract.test.sh. Its entire payload is 25 headers, two
# pkg-config files and its docs; the runtime `librockchip_mpp.so` symlink is
# shipped by librockchip-mpp1 itself, not by the -dev package, and
# gstreamer1.0-rockchip1 links the versioned soname `librockchip_mpp.so.1` and
# Depends on librockchip-mpp1 alone. Nothing is compiled on a CeraLive board.
gstreamer_runtime_packages:
  - rockchip-multimedia-config
  - librga2
  - librockchip-mpp1

# Frozen A/B layout, docs/partition-contract.md §3 (v1). NAME reference only —
# sizes/slot roles/threshold live in the frozen contract, never duplicated here.
partition_template: rk3588-ab

# SERIALCON from userpatches/config-*.conf (identical on both boards).
serial_console: ttyS2:1500000

# ---------------------------------------------------------------------------
# VARIANTS. Everything above this line is the BASE every overlay below starts
# from — it is no longer, by itself, an answer any build resolves: `edge` is the
# production track (`default_variant:` at the top of this file) and every other
# overlay is opt-in.
#
# Selection is never inferred from the board, the host or the branch:
#   build rock-5b-plus                     -> `edge` (the declared default)
#   build rock-5b-plus --variant vendor    -> the prebuilt Armbian vendor BSP
#   build rock-5b-plus --variant <name>    (or CERALIVE_KERNEL_VARIANT=<name>)
#
# `variants:` and `default_variant:` are both stripped before flattening, so no
# unselected overlay can leak a second kernel pin into the resolved params.
# See docs/kernel-tracks.md, docs/kernel-build-from-source.md and
# docs/kernel-currency-watch.md.
# ---------------------------------------------------------------------------
variants:
  # THE PREBUILT ARMBIAN VENDOR 6.1 BSP — the path that shipped every image
  # before the mainline flip, kept selectable while the mainline track proves
  # itself on hardware. It is a pure restatement of this file's own top-level
  # fields (arrays REPLACE wholesale on deep-merge, so re-declaring the branch is
  # enough to make the overlay non-empty and to say out loud which track it is),
  # which is why `--variant vendor` resolves byte-identically to what a bare
  # `./build <board>` resolved before `default_variant` existed — pinned against
  # the committed vendor-baseline fixtures.
  #
  # It declares NO kernel_source, so the kernel/DTB packages are fetched
  # prebuilt exactly as they always were. It also no longer carries the retired
  # `ceralive-cls-fw` extension, so this track has NO NET_CLS_FW: that capability
  # is in-tree on the mainline default now (rk3588-edge.fragment). Removing this
  # overlay and every vendor row it restates is the vendor-kernel retirement.
  vendor:
    armbian_branch: vendor

    # The Mali blob, declared HERE rather than in the family base — see the
    # firmware_packages note above for why a family list may only hold what
    # every track needs.
    firmware_packages:
      - armbian-firmware
      - libmali-valhall-g610-g24p0-wayland-gbm

  # Mainline-track kernel built FROM SOURCE with the CeraLive RK3588 patch
  # series (VEPU580 encoder + the HDMI-RX fixes). At the v7.2 base the Armbian
  # branch whose mapping yields KERNEL_MAJOR_MINOR=7.2 is `bleedingedge`
  # (armbian/build config/sources/families/include/rockchip64_common.inc), and
  # this field's schema enum — vendor|current|edge|none — cannot spell it. So it
  # STAYS `edge`, the mainline-track name, and the real mapping is re-derived
  # from armbian/build by CERALIVE/rk3588-kernel-patches scripts/preflight.sh
  # and recorded in its kernel-pin.env. Nothing is lost by that: no code under
  # lib/ consumes ARMBIAN_BRANCH for a kernel_source variant, so the value is
  # traceability metadata, and the U-Boot/firmware packages this track still
  # fetches prebuilt are selected by NAME (the board's variant_overrides), never
  # by this field. Armbian is consulted for the mapping ONLY — it is never
  # invoked as the build system (see kernel_source below).
  edge:
    armbian_branch: edge

    # GPU USERSPACE FOLLOWS THE KERNEL DRIVER, and on this track that is Mesa,
    # not the blob. Mainline binds the Mali-G610 — a Valhall CSF part — with the
    # in-tree open `panthor` DRM driver; CONFIG_DRM_PANTHOR=m survives in the
    # REAL resolved v7.2 config for this variant and is pinned in
    # ../kernel/required-symbols.list so it can never be dropped in silence. Its
    # userspace is Mesa's Gallium panthor/panfrost driver, which trixie ships as
    # dri/panthor_dri.so + dri/panfrost_dri.so onto mesa-libgallium.
    #
    # DROPPING libmali HERE IS LOAD-BEARING, NOT TIDINESS. The blob is ABI-bound
    # to Rockchip's out-of-tree vendor driver and its /dev/mali0 node, which a
    # mainline kernel never creates (armbian/build#10320), AND it ships
    # /etc/ld.so.conf.d/00-aarch64-mali.conf, whose `00-` prefix sorts first and
    # captures libEGL.so.1 / libGLESv2.so.2 / libgbm.so.1 for the whole image.
    # Installed on a mainline board it therefore does not merely fail to help —
    # it shadows Mesa and leaves the device with no working EGL at all. Nothing
    # falls back.
    #
    # armbian-firmware STAYS: it carries the WiFi/BT blobs and the GPU's own CSF
    # firmware, which the panthor driver loads exactly as the vendor driver did.
    # The `vendor` overlay (which keeps libmali) is unchanged.
    firmware_packages:
      - armbian-firmware

    # The BUILT package name replaces the family's vendor kernel package for
    # resolver/orchestrator purposes. The build stage validates the actual
    # Debian control Package:/Version:/Architecture: fields against this name,
    # kernel_source.package_version and the resolved arch.
    kernel_packages:
      - linux-image-7.2.0-ceralive-rk3588

    # NO separate DTB package: `make bindeb-pkg` ships the in-tree arm64 DTBs
    # inside the linux-image deb. kernel_source.dtb_deb_dir/dtb_boot_dir declare
    # how that in-deb path satisfies the board manifest's dtb_name expectation.
    dtb_packages: []

    kernel_source:
      # Armbian's KERNELSOURCE for the mainline track (linux-stable). This base
      # is an EXACT RELEASE TAG, not a rolling branch tip: the 7.1 track followed
      # linux-7.1.y and pinned whatever its tip was at import, which is not a
      # reproducible claim; 7.2 has a real release to name, so it names it.
      #
      # We pin the FINAL v7.2 tag, NOT Armbian's own `tag:v7.2-rc7`. That rc is
      # simply stale — v7.2 was tagged 2026-08-16, one day BEFORE the
      # armbian/build revision the 7.2 mapping was read from, and Armbian's
      # roll-over to the final tag has not been actioned. Pinning a release
      # candidate would gate this track on a kernel nobody will ever run. The
      # MAJOR.MINOR is identical either way, which is what makes the substitution
      # safe. `commit` remains the real pin — a moved tag fails the build loudly.
      #
      # mirror_url is a faster GitHub mirror of the SAME objects and is NOTHING
      # ELSE: build-kernel.sh consumes `git_url` only, so this key is resolved
      # (KERNEL_SOURCE_MIRROR_URL) and then read by no build code — exactly as
      # the schema's "only ever used when explicitly enabled" says, with nothing
      # enabling it. It is KEPT rather than dropped for two independent reasons.
      # It was RE-VERIFIED LIVE at this bump: gregkh/linux carries v7.2 with the
      # same annotated tag object (237a1c39e8dfd3e1c6f1f023eea37a48ec04cc63) and
      # the same peeled commit as kernel.org, so the mirror has not lagged. And
      # `edge-test` inherits it as a NON-EMPTY pin, which
      # tests/edge-test-variant.test.sh asserts. Re-check on the next bump rather
      # than assuming either way.
      git_url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      mirror_url: https://github.com/gregkh/linux.git
      tag: v7.2
      commit: 8d3ae59288f1e7d58d76558a6ee96d533bc5019f

      # The patch series is a BUILD INPUT and is exact-pinned like every other
      # BSP input — an IMMUTABLE commit, never a branch.
      #
      # WHAT THIS PIN IS. b28a187269f2 is the `main` commit of
      # CERALIVE/rk3588-kernel-patches produced by the squash-merge of PR #11,
      # the rebase of the series onto v7.2. At it, patches/series carries 22
      # ACTIVE members in three lanes:
      #
      #   upstream/  (4)  0001 VEPU580 encoder, 0002 HDMI-RX EDID, 0003 HDMI-RX
      #                   plugout, 0005 HDMI-RX audio — Ross Cawston's postings,
      #                   kept byte-identical to what he published.
      #   backports/ (3)  0010 combphy rterm-det-rdy, 0011 + 0012 dw-hdmi-qp
      #                   ACR/audio — unmerged lore postings, carried under the
      #                   truthful `lore-posting` provenance model.
      #   ceralive/ (15)  0006 HDMI-RX sound card, 0008 rkvenc DMA max segment
      #                   size, 0009 mainline `system-uncached` dma-heap,
      #                   0013-0022 the rkvenc/HDMI-RX hardening set, 0026
      #                   HDMI-RX register lock made hardirq-safe, 0027 HDMI-RX
      #                   SCDC/PHY retry hardening.
      #
      # THE ORDINALS ARE SLOT NUMBERS, NOT A COUNT — 22 members occupy a 27-slot
      # space and every gap is deliberate. 0004 was never published. 0007
      # (iommu-rockchip fetch-dte time limit) is RETIRED because it LANDED
      # UPSTREAM as 8d4346ecd495 in v7.2 — this base bump is what retired it.
      # 0023/0024/0025 are RETIRED because they were folded into 0021. A retired
      # ordinal is never reused. Per-patch history lives in that repo's
      # retired/REGISTRY.md and docs/UPSTREAM-STATUS.md; do not duplicate it here
      # and do not re-derive it from this file.
      #
      # 0013/0017/0018 are what make the opt-in `edge-test` variant's
      # deterministic fault injection possible; all three compile to nothing
      # unless their CeraLive test symbol is enabled, which production `edge`
      # resolves OFF (manifests/kernel/forbidden-symbols.list).
      #
      # 0027 CARRIES A WARNING THAT SURVIVED THE REBASE AND MUST NOT BE
      # "IMPROVED". It retries the HDMI-RX PHY bring-up once with
      # PHY_CONFIG.TMDS_CLOCK_RATIO forced to 1/40, clearing the forced flag on
      # plugout so every new plug cycle still tries the spec-compliant path
      # first — a 4K59.94 source that never writes the SCDC TMDS_Bit_Clock_Ratio
      # bit otherwise spins plugin -> wait -> not lock -> plugout forever. Do NOT
      # gate that recovery on CMU_TMDSQPCLK_FREQ: a 594 MHz 1/40 link mis-driven
      # at 1/10 measures as an ordinary sub-340 MHz link (139.0 MHz was
      # observed), so the gate would never fire in exactly the case the patch
      # exists for.
      #
      # HARDWARE EVIDENCE DOES NOT CROSS A BASE BUMP, AND THIS IS THE HONEST
      # STATEMENT OF IT. Every board result this series accumulated — the Rock
      # 5B+ MPP hardware-encode confirmation, the rkvenc fault-injection
      # receipts, the 4K HDMI-RX lock behind 0027 — was obtained against the
      # v7.1.7 base. NOTHING has been built, flashed or booted at v7.2, on either
      # board. What v7.2 evidence exists is a cross-compile of this exact tree
      # (22/22 `git am` clean, Image + modules + dtbs, zero errors) plus the
      # config-survival gate. Read this pin as compile-proven and
      # hardware-UNVALIDATED until a board says otherwise.
      #
      # PIN HYGIENE — pin a SHA a fresh clone can reach, never a PR-head SHA. A
      # squash-merge orphans the pre-merge branch head, so pinning that would pin
      # a commit no ref reaches; #4, #8 and #11 were all squash-merged, which is
      # why this pin is the RESULTING `main` commit and not the branch tip.
      # Verified before pinning: `git ls-remote
      # https://github.com/CERALIVE/rk3588-kernel-patches.git refs/heads/main`
      # answers b28a187269f2db993e490278788e348767aa24a8, and a scratch
      # `git init` + `git fetch --depth 1 <patches_git_url> <patches_commit>`
      # reaches it and yields a 22-entry patches/series whose members are
      # byte-identical to the merged tree — patches/ tree object
      # c4b7d4e148032102e6707dfb88ffa90795c9c958 on both sides.
      patches_git_url: https://github.com/CERALIVE/rk3588-kernel-patches.git
      patches_commit: b28a187269f2db993e490278788e348767aa24a8
      patches_series: patches/series

      defconfig_base: defconfig
      defconfig_fragment: manifests/kernel/rk3588-edge.fragment

      # Same digest-pinned base the canonical mkosi builder uses (ci/Dockerfile).
      # The kernel builder image is derived FROM this exact digest, so the pin of
      # record is this manifest line, not a Dockerfile default.
      builder_image: debian:trixie-20260623-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2

      # kernel_release is DERIVED, never guessed: `make -s kernelrelease
      # LOCALVERSION=-ceralive-rk3588` run against a fresh v7.2 clone at the
      # pinned commit, with this exact 22-member series applied and the resolved
      # defconfig+fragment synced, answers 7.2.0-ceralive-rk3588.
      #
      # NOTE THE `.0`, because it is the whole reason that probe is mandatory.
      # v7.2 FINAL has SUBLEVEL=0, so KERNELVERSION is 7.2.0 — where the 7.1.7
      # base spelled its own three components. A "7.2-ceralive-rk3588" spelling
      # looks right, matches the tag, and would fail build-kernel.sh's own
      # `kernelrelease != KERNEL_RELEASE` assertion before one object compiles.
      # package_version keeps the established shape (KERNELVERSION + -ceralive1)
      # and so moves with it; local_version carries no version and does not.
      local_version: -ceralive-rk3588
      kernel_release: 7.2.0-ceralive-rk3588
      package_version: 7.2.0-ceralive1

      # PLATFORM-LAYER INSTALL MAPPING. bindeb-pkg puts arm64 in-tree DTBs under
      # /usr/lib/linux-image-<KERNELRELEASE>/<vendor>/; the U-Boot boot script
      # resolves ${fdtfile} under /boot/dtb/rockchip/ (mkosi/platform/boot/
      # boot.scr.cmd). The platform layer copies source -> target so a
      # source-built kernel satisfies the SAME board dtb_name expectation an
      # Armbian linux-dtb-* package would.
      dtb_deb_dir: /usr/lib/linux-image-7.2.0-ceralive-rk3588/rockchip
      dtb_boot_dir: /boot/dtb/rockchip

  # DEBUG/TEST sibling of `edge`, and NOTHING ELSE. It exists so the Wave-6
  # negative-path QA (deterministic rkvenc/HDMI-RX fault injection, the dma-heap
  # KUnit seam) can run on a Rock 5B+ under KASAN + lockdep. It is NEVER released:
  # the release/publish guard (ci/check-release-variant.sh) rejects it by name, and
  # `ci/build-hardware-candidates.sh` builds it only as an explicitly non-shipping
  # debug artifact.
  #
  # `extends: edge` is the whole point. Every pin that decides WHAT SOURCE is
  # compiled — git_url, tag, commit, patches_git_url, patches_commit,
  # patches_series, builder_image, dtb_boot_dir — is INHERITED rather than copied,
  # so it is structurally impossible for this variant to drift onto a different
  # kernel or a different patch series than the production `edge` it is supposed to
  # be a debug build OF. A copy-paste sibling would look identical on the day it was
  # written and silently diverge on the first `edge` re-pin.
  #
  # The four fields below are the complete, deliberate difference, and each one is
  # an identity so the two artifacts can never be substituted for one another:
  # package name, LOCALVERSION, kernel release and Debian version. `dtb_deb_dir` is
  # the fifth, and it is NOT an independent choice — `make bindeb-pkg` installs the
  # in-tree DTBs under /usr/lib/<linux-image package>/, so it is a function of
  # kernel_release and has to move with it or validate_built_kernel_deb fails on a
  # path the build itself created. `dtb_boot_dir` (where the U-Boot script looks) is
  # genuinely shared and is inherited untouched.
  edge-test:
    extends: edge

    kernel_packages:
      - linux-image-7.2.0-ceralive-rk3588-test

    kernel_source:
      # ORDERED, and the order is the contract: the production fragment first, the
      # debug fragment second, so every symbol the test fragment sets wins over the
      # production answer for the same symbol. Both are merged before the SINGLE
      # olddefconfig/syncconfig/verify sequence, so the survival gate still runs
      # against everything both fragments declared.
      defconfig_fragments:
        - manifests/kernel/rk3588-edge.fragment
        - manifests/kernel/rk3588-edge-test.fragment

      # Derived by its OWN probe, not by editing edge's answer: the same v7.2
      # tree, series and sync sequence, re-run as `make -s kernelrelease
      # LOCALVERSION=-ceralive-rk3588-test`, answers 7.2.0-ceralive-rk3588-test.
      # Re-run a second time against edge-test's own TWO-fragment config it
      # answers identically, which is the honest reason a single probe would have
      # been enough — this fragment declares no CONFIG_LOCALVERSION, so the
      # release string is a pure function of the kernel version and LOCALVERSION.
      # It carries the same `.0` for the same reason edge does.
      local_version: -ceralive-rk3588-test
      kernel_release: 7.2.0-ceralive-rk3588-test
      package_version: 7.2.0-ceralive1+test1

      dtb_deb_dir: /usr/lib/linux-image-7.2.0-ceralive-rk3588-test/rockchip

  # VENDOR-track kernel built FROM SOURCE: the SAME 6.1.115 BSP the `vendor`
  # overlay installs prebuilt, plus CERALIVE/rk3588-vendor-kernel-patches. It exists
  # to restore HDMI-RX audio capture, which the stock vendor kernel lost when
  # armbian/linux-rockchip 78c67d98f221 (PR #430) unconditionally zeroed
  # hdmi-audio-codec capture channels for EVERY instance — a fix aimed at RK3576
  # HDMI-TX that killed RK3588 HDMI-RX, because rk_hdmirx registers through that
  # same codec. Board-confirmed: /proc/asound/pcm shows the card with zero
  # capture substreams and nothing anywhere reports an error.
  #
  # This is NOT `edge` with a different pin. Two things are structurally
  # different, and both are the reason build-kernel.sh grew its two general
  # modes rather than special-casing this variant:
  #
  #   1. NO TAG. rk-6.1-rkr5.1 is a rolling BSP branch that publishes no tags at
  #      all, so `tag:` is OMITTED and `commit:` is fetched directly. Do NOT add
  #      a synthetic tag to make this look like edge — there is no such ref.
  #   2. NO defconfig. Armbian ships a COMPLETE .config for this kernel, and it
  #      is the config the board actually runs. `make defconfig` would build a
  #      materially different driver/feature set, which would make any comparison
  #      against the shipped kernel meaningless. The config_* trio fetches that
  #      exact file at an exact armbian/build revision and uses it verbatim.
  #
  # It is opt-in and ships nothing: the production default is the mainline `edge`
  # track and this overlay is reached only through `--variant vendor-patched`.
  vendor-patched:
    armbian_branch: vendor

    # Same vendor kernel driver, so the same GPU userspace as the `vendor`
    # overlay: /dev/mali0 exists on this track and Mesa/panthor does not.
    firmware_packages:
      - armbian-firmware
      - libmali-valhall-g610-g24p0-wayland-gbm

    # Deliberately NOT `linux-image-vendor-rk35xx`. A name collision with the
    # stock package is the one failure that would produce a plausible image
    # rather than an error — the local repository would resolve one of the two
    # by version and the board could silently boot the UNPATCHED kernel. The
    # orchestrator's staged-package uniqueness check exists for the same reason.
    kernel_packages:
      - linux-image-6.1.115-ceralive-vendor-rk35xx

    # The stock vendor path DOES ship a separate linux-dtb-vendor-rk35xx, but a
    # `make bindeb-pkg` build cannot: 6.1's scripts/package/builddeb runs
    # dtbs_install into /usr/lib/<linux-image package> whenever
    # CONFIG_OF_EARLY_FLATTREE is set, so the in-tree DTBs ride inside the
    # linux-image deb exactly as they do on edge. dtb_deb_dir/dtb_boot_dir below
    # are what satisfy the board's dtb_name instead.
    dtb_packages: []

    kernel_source:
      git_url: https://github.com/armbian/linux-rockchip.git

      # No `tag:` — see the note above. THE pin. Chosen upstream because its
      # commit timestamp matches the running board's kernel build stamp to the
      # second (rk3588-vendor-kernel-patches docs/PREFLIGHT.md), so this is the
      # source of the kernel the fleet is running, not merely a nearby one.
      commit: 95e85f6cb496c75807c5b16f158853578e7e7d1b

      # Five patches: two backports of real mainline ASoC commits that replace
      # the unconditional capture zeroing with per-instance opt-out flags
      # (armbian/linux-rockchip PR #487 — OPEN, not merged, which is precisely
      # why the SHAs and not the PR ref are what is pinned upstream), a
      # first-party PL330/i2s-tdm DMA-budget change validated on a real board,
      # a first-party DIAGNOSTIC patch that changes no behaviour, and 0005 —
      # the fix that diagnostic found. 0001-0003 got the capture PCM to
      # register and open while every read() still returned EIO with an empty
      # dmesg; 0004 made that printable; its output showed the HDMI-RX audio
      # domain is never enabled, because AUDIO_ENABLE / I2S_EN are set only by
      # rk_hdmirx's audio work and nothing in the ALSA capture path started it.
      # 0005 starts it. Dropping 0004 now that 0005 is confirmed is a follow-up,
      # not pending cleanup. Predecessor pin: e3f97655ae47 (0001-0004).
      #
      # de46c1acba42 carries the correction to 0005 itself: its first version
      # waited for the audio work with flush_delayed_work() from a callback that
      # ASoC invokes with hdmi-codec's hcp->lock held, while that work calls back
      # into plugged_cb() which takes the same lock — a deadlock that fires only
      # when audio IS present. It now waits on a completion the work signals
      # before that callback, and disarms the work under a gate before a
      # synchronous cancel on every teardown path.
      #
      # BOARD-CONFIRMED on a Radxa ROCK 5B+: hw_ptr advanced 15934388 ->
      # 16030718 over ~2.007 s (≈48 kHz), RXS=1 with a non-zero RXFIFOLR=0xa,
      # zero "capture xfer failed" lines, and CeraUI's audio meters showed real
      # fluctuating levels. This is a confirmed-working series, not a WIP one.
      # Predecessor pin: db5d0e8a0711 (squash-merged into de46c1a via PR #1,
      # https://github.com/CERALIVE/rk3588-vendor-kernel-patches/pull/1). The
      # squash discarded the original commits, so db5d0e8a0711 is unreachable on
      # that repo's main and a fresh clone's patch fetch would FAIL on it.
      patches_git_url: https://github.com/CERALIVE/rk3588-vendor-kernel-patches.git
      patches_commit: de46c1acba420d69d30a82b3bc0f526293efd9a3
      patches_series: patches/series

      # The exact full .config Armbian builds linux-image-vendor-rk35xx from,
      # read as a plain FILE at a pinned revision. The Armbian build framework is
      # never invoked. Resolution chain for this path (LINUXFAMILY=rk35xx,
      # BRANCH=vendor -> LINUXCONFIG=linux-rk35xx-vendor) is derived and recorded
      # in rk3588-vendor-kernel-patches/kernel-pin.env, not guessed.
      config_git_url: https://github.com/armbian/build
      config_commit: 5e2fa21ab509e9cf6afb05f3df46c9bd2b0cfa39
      config_path: config/kernel/linux-rk35xx-vendor.config

      # That config is written for a tree Armbian has already mutated: its
      # EXTRAWIFI step copies whole out-of-tree WiFi driver trees in before
      # configuring. 24 of its symbols therefore have no Kconfig entry in the
      # pinned source and are correctly discarded. Each is enumerated and
      # justified here; the gate FAILS on a listed symbol that did survive, so
      # the list cannot rot into a blanket opt-out. Neither shipped board's
      # adapter is on it — both are in-tree and both survive.
      config_absent_symbols: manifests/kernel/rk3588-vendor-patched.absent

      # BOOKWORM, not trixie — and that is a deliberate divergence from `edge`.
      # This is a 6.1 tree built with CONFIG_WERROR=y, contemporary with GCC 12;
      # trixie's GCC 14 turns warnings the Rockchip BSP was never compiled
      # against into hard errors. Bookworm also carries pahole 1.24, squarely
      # inside the band 6.1's scripts/pahole-flags.sh knows about, and is the
      # release the device itself runs. builder_image is a PER-VARIANT pin for
      # exactly this reason: each variant pins the toolchain era its source needs.
      # suite-literal-ok: a digest-pinned BUILDER container that must match the vendor kernel's GCC-13 ABI; it is not the target rootfs and does not move with RELEASE
      builder_image: debian:bookworm-20260803-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241

      local_version: -ceralive-vendor-rk35xx
      kernel_release: 6.1.115-ceralive-vendor-rk35xx
      package_version: 6.1.115-ceralive1

      dtb_deb_dir: /usr/lib/linux-image-6.1.115-ceralive-vendor-rk35xx/rockchip
      dtb_boot_dir: /boot/dtb/rockchip
