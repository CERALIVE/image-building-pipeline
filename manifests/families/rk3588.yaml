# CeraLive Image Family Manifest — Rockchip RK3588 / RK3588S
#
# Validates against ../schema/family.schema.json (draft 2020-12).
# Captures SoC/arch-level build attributes shared by every rk3588 board
# (Orange Pi 5+, Radxa Rock 5B+). Per-board variance lives in ../boards/*.yaml.
#
# DECISION D3 IS SUPERSEDED FOR THE KERNEL HALF, AND THE VENDOR TRACK IS GONE.
# The kernel is the mainline 7.2 track built FROM SOURCE, selected by
# `default_variant: edge` below. The prebuilt Armbian vendor 6.1 BSP — its
# `armbian_branch: vendor` base and its `linux-image-*` / `linux-dtb-*` package
# pins — and the source-built overlay that rebuilt the same BSP from Armbian's
# published .config were both removed on the mainline cutover. Every byte of that
# machinery, exact package names and pins included, is preserved at the annotated
# tag `vendor-kernel-final`:
#   git show vendor-kernel-final:manifests/families/rk3588.yaml
#
# D3's OTHER half is unchanged and still locked: RAUC bootloader adapter =
# `custom`, because the staged U-Boot lacks persistent fw_setenv (FAT-file
# bootcount approach). That is a BOOTLOADER fact, and it survives the kernel
# retirement untouched — the boards still stage Armbian's U-Boot packages.
#
# Sources: configs/devices/{rock5bplus,orangepi5plus}.conf (BOARD_PACKAGES),
# userpatches/config-{rock5bplus,orangepi5plus}.conf (BRANCH=, EXTRA_BSP_PACKAGES),
# configs/base/ceraui-base.conf (STREAMING_PACKAGES HW path).

arch: arm64

# ---------------------------------------------------------------------------
# THE PRODUCTION KERNEL TRACK.
#
# A variant-less `./build <board>` resolves the `edge` overlay declared below —
# byte-identically to `./build <board> --variant edge`, board `variant_overrides`
# for `edge` included. So the mainline 7.2 source-built kernel is what ships, and
# the TOP-LEVEL fields under this block describe that same track: they are the
# base every overlay starts from, and since the vendor retirement there is no
# longer any track that disagrees with them about the kernel.
#
# WHY A POINTER AND NOT A COPY — STILL. `edge`'s `kernel_source` block is NOT
# moved up here, and the reason survived the vendor removal: `edge-test`
# `extends: edge`, and `apply_variant` validates a resolved `extends` overlay
# against the FULL `$defs/kernel_source` contract. With edge's pins at the family
# level that resolved overlay is a PARTIAL and fails on every required pin, so
# the only repairs would be re-stating the parent's pins in the child — the exact
# byte-for-byte drift `extends` exists to make impossible — or restructuring the
# schema so every variant `kernel_source` is a delta, which leaves `extends` with
# zero consumers. One declaration, one pin set, one answer.
#
# (The second historical reason — that a move would deep-merge this file's
# defconfig mode onto the retired source-built BSP overlay's config-FILE mode and
# produce the half-specified block `$defs/kernel_source`'s `oneOf` forbids — died
# with that overlay. The `edge-test` reason above is on its own sufficient.)
# ---------------------------------------------------------------------------
default_variant: edge

# The mainline track's Armbian branch name. At the v7.2 base the branch whose
# mapping yields KERNEL_MAJOR_MINOR=7.2 is actually `bleedingedge`
# (armbian/build config/sources/families/include/rockchip64_common.inc), which
# this field's schema enum — vendor|current|edge|none — cannot spell. So it stays
# `edge`, the mainline-track name, and the real mapping is re-derived from
# armbian/build by CERALIVE/rk3588-kernel-patches scripts/preflight.sh and
# recorded in its kernel-pin.env.
#
# Nothing under lib/ consumes ARMBIAN_BRANCH for a kernel_source track, so the
# value is traceability metadata: the U-Boot and firmware packages this track
# still fetches prebuilt are selected by NAME (the board's `uboot_packages` and
# its `variant_overrides`), never by this field. Armbian is consulted for the
# mapping ONLY — it is never invoked as the build system (see kernel_source).
armbian_branch: edge

# The BUILT kernel package name, declared ONCE. `edge` does not restate it: the
# family base and the production track are the same track now, and a second copy
# is exactly the drift `default_variant` exists to avoid. The build stage
# validates the actual Debian control Package:/Version:/Architecture: fields of
# the .deb `make bindeb-pkg` produces against this name and
# kernel_source.package_version, so a rename cannot silently yield an unused deb.
#
# It is never fetched: the resolver derives `kernel_source.suppressed_packages`
# from this list (pre-overlay UNION post-overlay) and the Armbian fetch skips
# every name in it. `edge-test` REPLACES this array with its own built name, and
# the union then carries both.
kernel_packages:
  - linux-image-7.2.0-ceralive-rk3588

# RK3588 U-Boot is BOARD-SPECIFIC in the Armbian feed (linux-u-boot-<board>-*),
# so the family declares none — each board names its own via the board manifest's
# uboot_packages override (board arrays REPLACE family arrays on deep-merge), and
# its `variant_overrides.edge.uboot_packages` names the mainline-TF-A `-edge`
# build the production track fetches.
uboot_packages: []

# NO separate DTB package on any track: `make bindeb-pkg` ships the in-tree arm64
# DTBs inside the linux-image deb it builds, and kernel_source.dtb_deb_dir /
# dtb_boot_dir declare how that in-deb path satisfies the board manifest's
# dtb_name expectation. The retired prebuilt vendor track was the only thing that
# ever resolved a `linux-dtb-*` package here.
dtb_packages: []

# Shared SoC/GPU/Wi-Fi firmware. armbian-firmware is the broad Armbian firmware
# bundle (ships realtek + broadcom WiFi blobs) and carries the Mali GPU's own CSF
# firmware, which the in-tree `panthor` driver loads.
#
# Task 19 firmware-split audit — KEEP armbian-firmware, do NOT swap to the Debian
# split (firmware-realtek + firmware-brcm80211). Armbian ships per-board NVRAM
# (.txt) configuration files alongside the blobs that Debian's split packages
# omit:
#   * Rock 5B+   → RTL8852BE  (was rtl8852be-firmware + firmware-realtek)
#   * Orange Pi 5+ → AP6275P / brcmfmac (Broadcom)
# `armbian-firmware` is already the TRIMMED Armbian variant (NOT
# armbian-firmware-full), i.e. the narrowest safe lever available.
# Size/feasibility detail: docs/size-notes.md.
#
# NO libmali. The proprietary Mali-G610 (Valhall) userspace blob drove Rockchip's
# out-of-tree kernel module through /dev/mali0, a node only the retired vendor
# kernel created; it was declared by the two vendor overlays and went with them.
# The mainline track binds the same silicon with the in-tree open `panthor` DRM
# driver (CONFIG_DRM_PANTHOR=m, pinned in ../kernel/required-symbols.list) and
# Mesa's Gallium panthor/panfrost driver. Re-adding the blob would not merely
# fail to help: it ships /etc/ld.so.conf.d/00-aarch64-mali.conf, whose `00-`
# prefix sorts first and captures libEGL.so.1 / libGLESv2.so.2 / libgbm.so.1 for
# the WHOLE image, so it would shadow Mesa and leave the board with no working
# EGL at all (armbian/build#10320).
#
# KEEP A FAMILY LIST TO WHAT EVERY TRACK NEEDS. The fetch path UNIONS this FILE's
# lists with the resolved env values (lib/fetch/bsp.sh::collect_declared_bsp_pkgs),
# so an overlay that resolves a strict SUBSET of a family list cannot remove a
# name that way — the build would still stage the .deb and then die at [3/9] as
# an "unclassified staged package", because the resolved FIRMWARE_PACKAGES that
# partitions the staging tree would not name it. Overlays ADD; they can never
# subtract.
firmware_packages:
  - armbian-firmware

# Decision D3: the staged U-Boot has no persistent fw_setenv → raw GPT bootcount
# approach. Unchanged by the kernel retirement.
rauc_bootloader_adapter: custom

# Hardware-accelerated GStreamer encode/decode (Rockchip MPP) feeding
# VIDEO_ENCODER/VIDEO_DECODER=rk3588_mpp. gstreamer1.0-rockchip-ceralive registers
# mpph264enc/mpph265enc/mppjpegenc/mppvp8enc against the MPP runtime below — PROVEN
# on real Rock 5B+ hardware (ffprobe-verified raw H.264/H.265 HW encode). The
# first-party release asset is pinned + SHA-256-verified in
# ../rk3588-userspace-deb-versions.txt and staged by fetch_rk3588_userspace.
hw_accel_gstreamer_plugins:
  - gstreamer1.0-rockchip-ceralive

# Runtime multimedia support for the MPP HW-accel path. librockchip-mpp1 is the MPP
# encode/decode runtime the gst plugin dlopens; librga2 is the RGA 2D accelerator it
# links; rockchip-multimedia-config ships the udev/config glue. None are in the
# Armbian bookworm arm64 feed — all pinned + SHA-256-verified in  # suite-literal-ok: names the Armbian BSP feed, not the target rootfs suite
# ../rk3588-userspace-deb-versions.txt and staged by fetch_rk3588_userspace.
#
# librockchip-mpp-dev was HERE and is now removed — verdict `REMOVE`, recorded
# with its evidence in ../packages/removed.md and pinned by
# tests/mpp-dev-runtime-contract.test.sh. Its entire payload is 25 headers, two
# pkg-config files and its docs; the runtime `librockchip_mpp.so` symlink is
# shipped by librockchip-mpp1 itself, not by the -dev package, and
# gstreamer1.0-rockchip-ceralive links the versioned soname `librockchip_mpp.so.1` and
# Depends on librockchip-mpp1 alone. Nothing is compiled on a CeraLive board.
gstreamer_runtime_packages:
  - rockchip-multimedia-config
  - librga2
  - librockchip-mpp1

# Frozen A/B layout, docs/partition-contract.md §3 (v1). NAME reference only —
# sizes/slot roles/threshold live in the frozen contract, never duplicated here.
partition_template: rk3588-ab

# SERIALCON from userpatches/config-*.conf (identical on both boards).
serial_console: ttyS2:1500000

# ---------------------------------------------------------------------------
# VARIANTS. Everything above this line is the BASE every overlay below starts
# from. `edge` is the production track (`default_variant:` at the top of this
# file) and carries the source-build pins; `edge-test` is its debug sibling and
# is never released.
#
# Selection is never inferred from the board, the host or the branch:
#   build rock-5b-plus                       -> `edge` (the declared default)
#   build rock-5b-plus --variant edge-test   (or CERALIVE_KERNEL_VARIANT=<name>)
#
# `variants:` and `default_variant:` are both stripped before flattening, so no
# unselected overlay can leak a second kernel pin into the resolved params.
# See docs/kernel-tracks.md, docs/kernel-build-from-source.md and
# docs/kernel-currency-watch.md.
# ---------------------------------------------------------------------------
variants:
  # THE PRODUCTION TRACK. Mainline kernel built FROM SOURCE with the CeraLive
  # RK3588 patch series (VEPU580 encoder + the HDMI-RX fixes).
  #
  # It carries ONLY `kernel_source`. Every other field it used to restate —
  # armbian_branch, kernel_packages, dtb_packages, firmware_packages — is now
  # declared once at the family level above, because since the vendor retirement
  # the family base and this track are the same track and a second copy would be
  # drift waiting to happen. `default_variant: edge` is what makes this the
  # production answer; the block stays HERE rather than at the family level so
  # `edge-test` can `extends:` it (see the note at the top of this file).
  edge:
    kernel_source:
      # Armbian's KERNELSOURCE for the mainline track (linux-stable). This base
      # is an EXACT RELEASE TAG, not a rolling branch tip: the 7.1 track followed
      # linux-7.1.y and pinned whatever its tip was at import, which is not a
      # reproducible claim; 7.2 has a real release to name, so it names it.
      #
      # We pin the FINAL v7.2 tag, NOT Armbian's own `tag:v7.2-rc7`. That rc is
      # simply stale — v7.2 was tagged 2026-08-16, one day BEFORE the
      # armbian/build revision the 7.2 mapping was read from, and Armbian's
      # roll-over to the final tag has not been actioned. Pinning a release
      # candidate would gate this track on a kernel nobody will ever run. The
      # MAJOR.MINOR is identical either way, which is what makes the substitution
      # safe. `commit` remains the real pin — a moved tag fails the build loudly.
      #
      # mirror_url is a faster GitHub mirror of the SAME objects and is NOTHING
      # ELSE: build-kernel.sh consumes `git_url` only, so this key is resolved
      # (KERNEL_SOURCE_MIRROR_URL) and then read by no build code — exactly as
      # the schema's "only ever used when explicitly enabled" says, with nothing
      # enabling it. It is KEPT rather than dropped for two independent reasons.
      # It was RE-VERIFIED LIVE at this bump: gregkh/linux carries v7.2 with the
      # same annotated tag object (237a1c39e8dfd3e1c6f1f023eea37a48ec04cc63) and
      # the same peeled commit as kernel.org, so the mirror has not lagged. And
      # `edge-test` inherits it as a NON-EMPTY pin, which
      # tests/edge-test-variant.test.sh asserts. Re-check on the next bump rather
      # than assuming either way.
      git_url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      mirror_url: https://github.com/gregkh/linux.git
      tag: v7.2
      commit: 8d3ae59288f1e7d58d76558a6ee96d533bc5019f

      # The patch series is a BUILD INPUT and is exact-pinned like every other
      # BSP input — an IMMUTABLE commit, never a branch.
      #
      # WHAT THIS PIN IS. cb491dc16fc1 is the `main` commit of
      # CERALIVE/rk3588-kernel-patches produced by the squash-merge of PR #13,
      # which added the `island/` lane. At it, patches/series carries 22 ACTIVE
      # members in FOUR lanes:
      #
      #   upstream/  (3)  0002 HDMI-RX EDID, 0003 HDMI-RX plugout, 0005 HDMI-RX
      #                   audio — Ross Cawston's postings, kept byte-identical to
      #                   what he published.
      #   backports/ (3)  0010 combphy rterm-det-rdy, 0011 + 0012 dw-hdmi-qp
      #                   ACR/audio — unmerged lore postings, carried under the
      #                   truthful `lore-posting` provenance model.
      #   ceralive/  (9)  0006 HDMI-RX sound card, 0009 mainline `system-uncached`
      #                   dma-heap, 0017 HDMI-RX audio lifecycle, 0018 dma-heap
      #                   truthful partial registration, 0026 HDMI-RX register lock
      #                   made hardirq-safe, 0027 HDMI-RX SCDC/PHY retry hardening,
      #                   0028-0030 the Type-C dual-role-power set.
      #   island/    (7)  0031-0037 — the `rk3588-media-island` v2026.9.0 release
      #                   asset, ingested BYTE-PRESERVED: the MPP + multi_rga driver
      #                   source, the drivers/video/rockchip Kconfig/Makefile hooks,
      #                   the two IOMMU provider exports, and the three MPP
      #                   device-tree ownership hunks (encoder, decoders, jpegd).
      #
      # A 22-MEMBER SERIES AT BOTH THIS PIN AND THE PREVIOUS ONE IS A COINCIDENCE OF
      # ARITHMETIC, NOT CONTINUITY. The `island/` lane contributes seven members and
      # ten are retired at the same commit: 0001, the standalone VEPU580 V4L2 encoder,
      # and its nine rkvenc siblings 0008, 0013-0016 and 0019-0022 — each superseded
      # by island source rather than dropped. Hardware encode is therefore a client of
      # the Rockchip MPP service here and not a driver of its own, so
      # CONFIG_VIDEO_ROCKCHIP_RKVENC exists in no Kconfig at this pin and
      # manifests/kernel/rk3588-edge.fragment names the island's symbols instead.
      #
      # THE ORDINALS ARE SLOT NUMBERS, NOT A COUNT — 22 members occupy a 37-slot
      # space and every gap is deliberate. 0004 was never published. 0007
      # (iommu-rockchip fetch-dte time limit) is RETIRED because it LANDED
      # UPSTREAM as 8d4346ecd495 in v7.2 — the v7.2 base bump retired it.
      # 0023/0024/0025 were RETIRED because they were folded into 0021, which is
      # itself now retired. A retired ordinal is never reused, which is why the
      # island lane starts at 0031 rather than reclaiming 0001. Per-patch history
      # lives in that repo's retired/REGISTRY.md and docs/UPSTREAM-STATUS.md; do
      # not duplicate it here and do not re-derive it from this file.
      #
      # THE `edge-test` FAULT-INJECTION SEAM MOVED WITH THE ENCODER, AND ALL THREE
      # OF ITS OLD SYMBOLS WENT — not just the encoder's. Retired 0013 declared
      # VIDEO_ROCKCHIP_RKVENC_CERALIVE_TEST, VIDEO_ROCKCHIP_HDMIRX_CERALIVE_TEST and
      # DMABUF_HEAPS_CERALIVE_TEST in one place even though the code they gated sat
      # across three patches, so retiring it removed the hdmirx and dma-heap symbols
      # too while 0017 and 0018 survive. The island's own
      # ROCKCHIP_MPP_CERALIVE_TEST replaces all three under the same contract:
      # `depends on DEBUG_FS`, `default n`, zero bytes when off, and production
      # `edge` resolves it OFF (manifests/kernel/forbidden-symbols.list).
      #
      # 0027 CARRIES A WARNING THAT SURVIVED THE REBASE AND MUST NOT BE
      # "IMPROVED". It retries the HDMI-RX PHY bring-up once with
      # PHY_CONFIG.TMDS_CLOCK_RATIO forced to 1/40, clearing the forced flag on
      # plugout so every new plug cycle still tries the spec-compliant path
      # first — a 4K59.94 source that never writes the SCDC TMDS_Bit_Clock_Ratio
      # bit otherwise spins plugin -> wait -> not lock -> plugout forever. Do NOT
      # gate that recovery on CMU_TMDSQPCLK_FREQ: a 594 MHz 1/40 link mis-driven
      # at 1/10 measures as an ordinary sub-340 MHz link (139.0 MHz was
      # observed), so the gate would never fire in exactly the case the patch
      # exists for.
      #
      # HARDWARE EVIDENCE DOES NOT CROSS A BASE BUMP, AND THIS IS THE HONEST
      # STATEMENT OF IT. Both Rock 5B+ and Orange Pi 5 Plus boards have booted
      # a v7.2.0-ceralive-rk3588 kernel and passed direct GStreamer generic and
      # MPP hardware 60-second encodes, validating the kernel/userspace MPP
      # encoder ABI on real hardware. That is narrower than full release
      # qualification: no complete pinned Trixie candidate image has yet been
      # built, flashed, and OTA-tested end to end. Read this pin as
      # kernel-on-silicon compatibility-proven, with release qualification still
      # outstanding.
      #
      # PIN HYGIENE — pin a SHA a fresh clone can reach, never a PR-head SHA. A
      # squash-merge orphans the pre-merge branch head, so pinning that would pin
      # a commit no ref reaches; #4, #8 and #11 were all squash-merged, which is
      # why this pin is the RESULTING `main` commit and not the branch tip.
      # Verified before pinning: `git ls-remote
      # https://github.com/CERALIVE/rk3588-kernel-patches.git refs/heads/main`
      # answers cb491dc16fc102649c7d4c003ea954cfa9e3c494, that commit reaches a
      # 22-entry patches/series (patches/ tree object
      # fc4e4d9a58db3536cbf5fd9bcdb3388ec0dff12b), and the whole series applies to
      # v7.2 with its own post-apply gate green.
      patches_git_url: https://github.com/CERALIVE/rk3588-kernel-patches.git
      patches_commit: cb491dc16fc102649c7d4c003ea954cfa9e3c494
      patches_series: patches/series

      defconfig_base: defconfig
      defconfig_fragment: manifests/kernel/rk3588-edge.fragment

      # Same digest-pinned base the canonical mkosi builder uses (ci/Dockerfile).
      # The kernel builder image is derived FROM this exact digest, so the pin of
      # record is this manifest line, not a Dockerfile default.
      builder_image: debian:trixie-20260623-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2

      # kernel_release is DERIVED, never guessed: `make -s kernelrelease
      # LOCALVERSION=-ceralive-rk3588` run against a fresh v7.2 clone at the
      # pinned commit, with this exact 22-member series applied and the resolved
      # defconfig+fragment synced, answers 7.2.0-ceralive-rk3588.
      #
      # NOTE THE `.0`, because it is the whole reason that probe is mandatory.
      # v7.2 FINAL has SUBLEVEL=0, so KERNELVERSION is 7.2.0 — where the 7.1.7
      # base spelled its own three components. A "7.2-ceralive-rk3588" spelling
      # looks right, matches the tag, and would fail build-kernel.sh's own
      # `kernelrelease != KERNEL_RELEASE` assertion before one object compiles.
      # package_version keeps the established shape (KERNELVERSION + -ceralive1)
      # and so moves with it; local_version carries no version and does not.
      local_version: -ceralive-rk3588
      kernel_release: 7.2.0-ceralive-rk3588
      package_version: 7.2.0-ceralive1

      # PLATFORM-LAYER INSTALL MAPPING. bindeb-pkg puts arm64 in-tree DTBs under
      # /usr/lib/linux-image-<KERNELRELEASE>/<soc-vendor>/; the U-Boot boot script
      # resolves ${fdtfile} under /boot/dtb/rockchip/ (mkosi/platform/boot/
      # boot.scr.cmd). The platform layer copies source -> target so the
      # source-built kernel satisfies the board manifest's dtb_name expectation.
      dtb_deb_dir: /usr/lib/linux-image-7.2.0-ceralive-rk3588/rockchip
      dtb_boot_dir: /boot/dtb/rockchip

  # DEBUG/TEST sibling of `edge`, and NOTHING ELSE. It exists so the Wave-6
  # negative-path QA (deterministic rkvenc/HDMI-RX fault injection, the dma-heap
  # KUnit seam) can run on a Rock 5B+ under KASAN + lockdep. It is NEVER released:
  # the release/publish guard (ci/check-release-variant.sh) rejects it by name, and
  # `ci/build-hardware-candidates.sh` builds it only as an explicitly non-shipping
  # debug artifact.
  #
  # `extends: edge` is the whole point. Every pin that decides WHAT SOURCE is
  # compiled — git_url, tag, commit, patches_git_url, patches_commit,
  # patches_series, builder_image, dtb_boot_dir — is INHERITED rather than copied,
  # so it is structurally impossible for this variant to drift onto a different
  # kernel or a different patch series than the production `edge` it is supposed to
  # be a debug build OF. A copy-paste sibling would look identical on the day it was
  # written and silently diverge on the first `edge` re-pin.
  #
  # The four fields below are the complete, deliberate difference, and each one is
  # an identity so the two artifacts can never be substituted for one another:
  # package name, LOCALVERSION, kernel release and Debian version. `dtb_deb_dir` is
  # the fifth, and it is NOT an independent choice — `make bindeb-pkg` installs the
  # in-tree DTBs under /usr/lib/<linux-image package>/, so it is a function of
  # kernel_release and has to move with it or validate_built_kernel_deb fails on a
  # path the build itself created. `dtb_boot_dir` (where the U-Boot script looks) is
  # genuinely shared and is inherited untouched.
  edge-test:
    extends: edge

    kernel_packages:
      - linux-image-7.2.0-ceralive-rk3588-test

    kernel_source:
      # ORDERED, and the order is the contract: the production fragment first, the
      # debug fragment second, so every symbol the test fragment sets wins over the
      # production answer for the same symbol. Both are merged before the SINGLE
      # olddefconfig/syncconfig/verify sequence, so the survival gate still runs
      # against everything both fragments declared.
      defconfig_fragments:
        - manifests/kernel/rk3588-edge.fragment
        - manifests/kernel/rk3588-edge-test.fragment

      # Derived by its OWN probe, not by editing edge's answer: the same v7.2
      # tree, series and sync sequence, re-run as `make -s kernelrelease
      # LOCALVERSION=-ceralive-rk3588-test`, answers 7.2.0-ceralive-rk3588-test.
      # Re-run a second time against edge-test's own TWO-fragment config it
      # answers identically, which is the honest reason a single probe would have
      # been enough — this fragment declares no CONFIG_LOCALVERSION, so the
      # release string is a pure function of the kernel version and LOCALVERSION.
      # It carries the same `.0` for the same reason edge does.
      local_version: -ceralive-rk3588-test
      kernel_release: 7.2.0-ceralive-rk3588-test
      package_version: 7.2.0-ceralive1+test1

      dtb_deb_dir: /usr/lib/linux-image-7.2.0-ceralive-rk3588-test/rockchip
