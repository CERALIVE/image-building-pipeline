# CeraLive Image Family Manifest — Rockchip RK3588 / RK3588S
#
# Validates against ../schema/family.schema.json (draft 2020-12).
# Captures SoC/arch-level build attributes shared by every rk3588 board
# (Orange Pi 5+, Radxa Rock 5B+). Per-board variance lives in ../boards/*.yaml.
#
# Decision D3 (locked): kernel/U-Boot branch = `vendor` (HDMI hdmirx + mature
# MPP HW-encode require the vendor kernel) and RAUC bootloader adapter = `custom`
# (the staged vendor U-Boot lacks persistent fw_setenv → FAT-file bootcount approach).
#
# Sources: configs/devices/{rock5bplus,orangepi5plus}.conf (BOARD_PACKAGES),
# userpatches/config-{rock5bplus,orangepi5plus}.conf (BRANCH=, EXTRA_BSP_PACKAGES),
# configs/base/ceraui-base.conf (STREAMING_PACKAGES HW path).

arch: arm64

# BRANCH= from userpatches/config-*.conf (both boards) — NOT the dead
# ARMBIAN_BRANCH=current in configs/devices/*.conf. Decision D3.
armbian_branch: vendor

# linux-image-* of BOARD_PACKAGES, resolved to the `vendor` branch (D3). The
# Armbian bookworm arm64 vendor kernel for RK35xx SoCs ships as -rk35xx (the
# -rockchip64 name was a migration placeholder that doesn't exist in the feed).
kernel_packages:
  - linux-image-vendor-rk35xx

# RK3588 U-Boot is BOARD-SPECIFIC in the Armbian feed (linux-u-boot-<board>-vendor),
# so the family declares none — each board names its own via the board manifest's
# uboot_packages override (board arrays REPLACE family arrays on deep-merge). The
# old rkbin-rk3588 entry was an internal placeholder; no such package exists in apt.
uboot_packages: []

# linux-dtb-* of BOARD_PACKAGES, resolved to the `vendor` branch (D3). Matches the
# -rk35xx vendor kernel naming above (the -rockchip64 name was a placeholder).
dtb_packages:
  - linux-dtb-vendor-rk35xx

# Shared SoC/GPU/Wi-Fi firmware. armbian-firmware is the broad Armbian firmware
# bundle (ships realtek + broadcom WiFi blobs).
#
# Task 19 firmware-split audit — KEEP armbian-firmware, do NOT swap to the Debian
# split (firmware-realtek + firmware-brcm80211). Both rk3588 boards run the Armbian
# VENDOR kernel (Decision D3) whose out-of-tree WiFi/BT drivers expect Armbian's
# board-matched blobs AND per-board NVRAM config files:
#   * Rock 5B+   → RTL8852BE  (was rtl8852be-firmware + firmware-realtek)
#   * Orange Pi 5+ → AP6275P / brcmfmac (Broadcom)
# Debian's split packages target the MAINLINE in-tree drivers and omit the Armbian
# NVRAM (.txt) files, so a swap risks WiFi never associating on the vendor kernel.
# `armbian-firmware` is already the TRIMMED Armbian variant (NOT armbian-firmware-full),
# i.e. the narrowest safe lever available — there is no finer split that keeps the
# vendor-kernel WiFi/BT path intact. Size/feasibility detail: docs/size-notes.md.
#
# The Mali-G610 (Valhall) GPU userspace driver (libEGL/libGLESv2/libgbm) is NOT in
# the Armbian bookworm arm64 feed. It is pinned to an exact upstream release asset
# and SHA-256-verified in ../rk3588-userspace-deb-versions.txt (staged by
# fetch_rk3588_userspace, excluded from the Armbian fetch). The g24p0 wayland-gbm
# variant is the one the default kiosk (cage = a Wayland compositor) needs — see
# docs/cog-display-addon.md §5. It unblocks the 5.4 Kiosk / Cog+WPEWebKit EGL/GBM
# path; on-hardware render stays the HW-gated QA item (cog-display-addon.md §7). The
# GPU's CSF firmware blob rides the vendor kernel / armbian-firmware.
firmware_packages:
  - armbian-firmware
  - libmali-valhall-g610-g24p0-wayland-gbm

# Decision D3: vendor U-Boot has no fw_setenv → raw GPT bootcount approach.
rauc_bootloader_adapter: custom

# Hardware-accelerated GStreamer encode/decode (Rockchip MPP) feeding
# VIDEO_ENCODER/VIDEO_DECODER=rk3588_mpp. gstreamer1.0-rockchip1 registers
# mpph264enc/mpph265enc/mppjpegenc/mppvp8enc against the MPP runtime below — PROVEN
# on real Rock 5B+ hardware (ffprobe-verified raw H.264/H.265 HW encode). It is NOT
# in the Armbian bookworm arm64 feed; pinned + SHA-256-verified in
# ../rk3588-userspace-deb-versions.txt (radxa rk3588s2-bookworm build — tsukumijima
# publishes no gst-rockchip mirror). Staged by fetch_rk3588_userspace.
hw_accel_gstreamer_plugins:
  - gstreamer1.0-rockchip1

# Runtime multimedia support for the MPP HW-accel path. librockchip-mpp1 is the MPP
# encode/decode runtime the gst plugin dlopens; librga2 is the RGA 2D accelerator it
# links; rockchip-multimedia-config ships the udev/config glue. None are in the
# Armbian bookworm arm64 feed — all pinned + SHA-256-verified in
# ../rk3588-userspace-deb-versions.txt and staged by fetch_rk3588_userspace.
#
# librockchip-mpp-dev was HERE and is now removed — verdict `REMOVE`, recorded
# with its evidence in ../packages/removed.md and pinned by
# tests/mpp-dev-runtime-contract.test.sh. Its entire payload is 25 headers, two
# pkg-config files and its docs; the runtime `librockchip_mpp.so` symlink is
# shipped by librockchip-mpp1 itself, not by the -dev package, and
# gstreamer1.0-rockchip1 links the versioned soname `librockchip_mpp.so.1` and
# Depends on librockchip-mpp1 alone. Nothing is compiled on a CeraLive board.
gstreamer_runtime_packages:
  - rockchip-multimedia-config
  - librga2
  - librockchip-mpp1

# Frozen A/B layout, docs/partition-contract.md §3 (v1). NAME reference only —
# sizes/slot roles/threshold live in the frozen contract, never duplicated here.
partition_template: rk3588-ab

# SERIALCON from userpatches/config-*.conf (identical on both boards).
serial_console: ttyS2:1500000

# ---------------------------------------------------------------------------
# OPT-IN VARIANTS. Everything above this line is the DEFAULT (vendor) variant —
# the production path, and the only path any shipped image has ever used.
#
# A variant applies ONLY when a build explicitly asks for it:
#   build rock-5b-plus --variant edge      (or CERALIVE_KERNEL_VARIANT=edge)
# Nothing infers a variant from the board, the host or the branch. With no
# variant the resolver strips this block entirely, so the resolved production
# parameter set is byte-identical to the manifest before variants existed
# (pinned by the vendor-baseline fixtures in tests/manifests/fixtures/).
#
# Declaring `edge` here does NOT reopen decision D3. D3 (vendor BSP) remains the
# shipped kernel; this is the mainline-track option kept buildable and pinned.
# See docs/kernel-build-from-source.md and docs/kernel-currency-watch.md.
# ---------------------------------------------------------------------------
variants:
  # Mainline-track kernel built FROM SOURCE with the CeraLive RK3588 patch
  # series (VEPU580 encoder + the three HDMI-RX fixes). Armbian maps rk3588
  # BRANCH=edge to KERNEL_MAJOR_MINOR=7.1; that mapping is re-derived from
  # armbian/build by CERALIVE/rk3588-kernel-patches scripts/preflight.sh and
  # recorded in its kernel-pin.env. Armbian is consulted for that mapping ONLY —
  # it is never invoked as the build system (see kernel_source below).
  edge:
    armbian_branch: edge

    # The BUILT package name replaces the family's vendor kernel package for
    # resolver/orchestrator purposes. The build stage validates the actual
    # Debian control Package:/Version:/Architecture: fields against this name,
    # kernel_source.package_version and the resolved arch.
    kernel_packages:
      - linux-image-7.1.7-ceralive-rk3588

    # NO separate DTB package: `make bindeb-pkg` ships the in-tree arm64 DTBs
    # inside the linux-image deb. kernel_source.dtb_deb_dir/dtb_boot_dir declare
    # how that in-deb path satisfies the board manifest's dtb_name expectation.
    dtb_packages: []

    kernel_source:
      # Armbian's KERNELSOURCE for edge (mainline stable). Armbian follows the
      # ROLLING branch linux-7.1.y; we pin the exact tag that was its tip at
      # import, because "verified against linux-7.1.y" is not a reproducible
      # claim. commit is the real pin — a moved tag fails the build loudly.
      git_url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      mirror_url: https://github.com/gregkh/linux.git
      tag: v7.1.7
      commit: c7ba9d6de43e9d9bd755b1f3c19501a38898c6b6

      # The patch series is a BUILD INPUT and is exact-pinned like every other
      # BSP input — an IMMUTABLE commit, never a branch.
      #
      # HARDWARE-TEST SERIES TIP. This SHA is the tip of
      # CERALIVE/rk3588-kernel-patches `feat/backports-fixes-doctrim` — the exact
      # software state the Wave-8 hardware-qualification candidates are built
      # from, pinned BEFORE those candidates are built so the artifacts and the
      # patch series can never drift apart. It grows the series from nine patches
      # to eighteen: the four approved backports (0007 iommu fetch-dte time
      # limit — merged; 0010 combphy rterm-det-rdy, 0011/0012 dw-hdmi-qp ACR/audio
      # — unmerged lore postings carried under the truthful `lore-posting`
      # provenance model), and six first-party follow-ups (0013 rkvenc CeraLive
      # test instrumentation, 0014 rkvenc teardown + service/CCU unwind, 0015
      # rkvenc resource-error observability, 0016 rkvenc ioctl bounds, 0017
      # HDMI-RX audio lifecycle + clock errors, 0018 truthful dma-heap partial
      # registration). 0013/0017/0018 are what make the opt-in `edge-test`
      # variant's deterministic fault injection possible; all three compile to
      # nothing unless their CeraLive test symbol is enabled, which production
      # `edge` resolves OFF (manifests/kernel/forbidden-symbols.list).
      #
      # It also carries 0019, which is the reason this pin moved off
      # 7c6948b66c4d: the FIRST debug candidate built from that SHA reached a real
      # Rock 5B+ and its KASAN+LOCKDEP kernel reported two genuine defects during
      # a plain, unfaulted 1080p encode — no fault injection involved. Both are
      # 0001's as imported, not regressions from the Wave-6 work above.
      # rkvenc_task_worker_default() took queue->pending_lock (a struct mutex)
      # while holding queue->running_lock via spin_lock_irqsave(), i.e. a sleeping
      # lock from atomic context; and the dma-buf import path called the LOCKED
      # dma_buf_{map,unmap}_attachment(), which assert the caller holds
      # dmabuf->resv, from a static importer that holds no such lock. 0019 makes
      # pending_lock a spinlock_t and moves those calls to the _unlocked variants.
      # 0019 is CONFIRMED on hardware: the third debug candidate ran the rkvenc
      # fault cases with no sanitizer or lockdep report at all.
      #
      # It also carries 0020, which is why the pin moved off 6b03217. That same
      # third attempt found a SECOND, independent defect — this one in 0014's own
      # service lifetime model, not in imported code. rkvenc_core_unwind() ended
      # its first step with rkvenc_service_quiesce(), which drives srv->state
      # LIVE -> QUIESCING -> DEAD, and nothing in the driver ever restores LIVE.
      # A single core's unbind therefore killed /dev/mpp_service permanently:
      # every later open() got -ENODEV even though the core had re-probed cleanly
      # and republished itself, because rkvenc_dev_open() refuses on
      # `state != RKVENC_SRV_LIVE` as well as on a missing sub-device. 0020 keeps
      # the drain — in-flight waiters must still be aborted before the core frees
      # its IRQ — but gives the terminal state to the caller: service remove() and
      # shutdown() still end DEAD, while a core's unwind returns a fully drained
      # service to LIVE. The refusal while the core is absent is unchanged; it is
      # carried by the sub_devices[] guard, which the next probe reverses.
      #
      # It now carries 0021 and 0022, which is why the pin moved off 5a272f4.
      # Todo45's REAL Rock 5B+ hardware fault-injection run — not a synthetic
      # fixture or unit-test result — found two more independent defects. First,
      # fail-clock-enable exposed a real rwsem lock imbalance: rkvenc_hw_run()
      # can leave before acquiring the hw-run lock, while rkvenc_task_finish()
      # released it unconditionally, producing bad unlock balance, rwsem
      # underflow, and a PM usage-count underflow. 0021 records whether the
      # acquisition actually happened with TASK_STATE_HW_HELD and releases only
      # when that bit is set. Second, the same real hardware run's malformed
      # ioctl sweep failed four of eight expected cases because register
      # requests were not fully covered by the class map and elements were not
      # required to be whole and aligned; 0022 adds req_fully_covered(), whole-
      # element bounds checks, and the copy_from_user() errno fix.
      # Hardware re-verification is PENDING: a rebuild and re-test on the Rock
      # 5B+ is the very next step, and has not been done yet; this pin is what
      # that attempt must be built from.
      #
      # The corrected 0022 is why the pin moved off ca98ea4. That pin's own
      # 0022 broke real hardware encode: a disciplined cold-boot, no-fault
      # control test — not a fault-injection case — made every production MPP
      # encode request fail with -EINVAL. The root cause was that the coverage
      # check did not tolerate genuine, pre-existing gaps in reg_msg[] between
      # every adjacent register-class pair; real requests can straddle one of
      # those gaps at their trailing edge. The fix makes req_coverage_check()
      # ask WHERE bytes were dropped — whether there is a hole inside the
      # covered span — rather than just HOW MANY: covered bytes must form one
      # contiguous run, and the request must fit within the register map's own
      # extent. It therefore accepts the real 96-byte MPP request while still
      # rejecting class-overrun, trans-table-odd-size, and bad-user-pointer.
      # Hardware re-verification is PENDING again: this exact same lesson —
      # fixing one thing, breaking another, and finding it only on hardware —
      # has happened twice this session. The corrected pin has not yet been
      # rebuilt and re-tested on the Rock 5B+; that cold-boot control encode is
      # the next proof, not evidence we already have.
      #
      # It now carries 0023, which is why the pin moved off 7d96290. While
      # confirming defect B's 0021 fix was reachable for the first time on real
      # Rock 5B+ hardware, KASAN found a use-after-free in
      # rkvenc_task_worker_default(). This bug was pre-existing: 0021 only made
      # the path reachable and survivable; it did not introduce the UAF, and
      # 0021 was neither modified nor reverted. After rkvenc_task_finish()
      # handed off the worker's reference, it could free the task, but the
      # worker still touched that pointer in the IRQ arm's "process timed-out
      # tasks" section and in the failure arm's redundant wake_up(). 0023
      # nulls the pointer after the handoff in the IRQ arm and drops that
      # redundant wake_up(), since rkvenc_task_finish() already wakes the
      # waiter on every path.
      # Hardware re-verification is PENDING again: this is the fourth time in
      # this session a fix needs fresh hardware confirmation; the corrected pin
      # has not yet been rebuilt and re-tested on the Rock 5B+.
      #
      # It now carries 0024, which is why the pin moved off cabc6b5. While
      # module-swap testing the previous pin on real Rock 5B+ hardware, defect G
      # reproduced as a KASAN null-ptr-deref in __iommu_attach_group, preceded
      # by possible recursive locking on the reset-group rwsem: after a main-core
      # unbind, the secondary core kept its dispatch-queue slot even though its
      # IOMMU domain pointer was NULL, so a later dispatch called
      # iommu_attach_group() with no domain. 0024 makes dispatchability and
      # IOMMU-domain validity the same fact: RKVENC_STAGE_QUEUE_PUBLISHED and
      # RKVENC_STAGE_IOMMU_SHARED gate both together, and
      # rkvenc_ccu_reshare_domain() re-attaches and republishes a secondary only
      # after it has successfully shared the main core's domain again. The
      # hardware result was 1/1 Oops on the unpatched module and 0/0 Oops on the
      # patched module across repeated concurrent-encode stress. The same
      # investigation closed defect H as a real measured MPP/GStreamer
      # userspace behavior, not a kernel bug: rkvenc_hw_run entered 60 times and
      # left 59 for 60 frames, with one correctly reported -ENODEV failure and
      # no retry, while the failed frame was dropped and the stream measured
      # 1,697,683 bytes versus 1,854,524 healthy (about 8.5% shorter). That
      # layer is outside this driver's control, so H needs no kernel patch.
      # Hardware re-verification via a FULL clean todo45 attempt is PENDING:
      # the evidence above is module-swap spot-testing of 0024, not a complete
      # clean twelve-command QA run.
      #
      # It now carries 0025 and 0026, which is why the pin moved off b4dd39a.
      # This is the last real driver defect found in this session (defect D):
      # service-node-only unbind lets the cores unbind first through automatic
      # device-link removal, so rkvenc_service_quiesce() sees
      # RKVENC_DRAIN_NOT_OWNER and skips the drain entirely; the discarded
      # timeout result could then still let devres_release_all() free srv while
      # an open /dev/mpp_service file descriptor remained able to dereference
      # it. The same investigation found the third sub-defect: taking a mutex
      # inside the rkvenc_service_sessions_gone() wait_event* condition can
      # emit __might_sleep when a session remains open at the second check.
      # 0025 makes srv reference-counted rather than devm-allocated, publishes
      # an embedded struct device through cdev_device_add() so its kobject
      # parenting covers __fput()'s later cdev_put() after ->release(), and
      # makes remove() wait unbounded and interruptible for all open-file
      # references. Unbounded is required because expiring a bounded wait
      # would still free reachable state; interruptible avoids deadlocking the
      # process tree that must close the descriptor. The wait condition is
      # mutex-free. The orchestrator independently hardware-validated the fix
      # across 35 adversarial module-swap rounds (deadlock hunt x5, jittered
      # close/unbind race x20, sever path x10): zero sanitizer hits, with all
      # four unbind states (idle, held-fd, inflight, timeout-negative) passing.
      # Final Wave completion for todo45 now depends only on (a) one full clean
      # hardware re-run of the complete twelve-command block at this revision,
      # and (b) attaching a physical HDMI source for the separate audio-drill
      # requirement (finding E).
      #
      # The previous twenty-two-patch pin (ca98ea4b083e5e0ee48221de71f2e45c622bd5bc)
      # is what surfaced this 0022 regression, the twenty-patch pin before it is
      # what surfaced the 0021/0022 defects, and the nineteen-patch pin before
      # that is what surfaced 0020's. The eighteen-patch pin before those
      # surfaced 0019's. Predecessor before those:
      # acb519c101fefa31f51300779f3a139bcabf6a1c (nine patches; 0008
      # rkvenc DMA max segment size + 0009 mainline `system-uncached` dma-heap,
      # the pair that made MPP hardware encode work on this track — board-confirmed
      # on a Rock 5B+). Predecessor before that: 9c1cb385098d.
      #
      # Pin a SHA that a fresh clone can reach, never a PR-head SHA: the
      # squash-merge of #4 orphaned its pre-merge head 2e195f2d36db, so pinning
      # that would pin a commit no ref reaches. This pin is a BRANCH TIP rather
      # than a `main` commit on purpose — the branch has not merged yet, and the
      # hardware evidence must name the exact revision it was produced from.
      #
      # The branch is pushed, so `git fetch --depth 1 <patches_git_url>
      # <patches_commit>` from a scratch clone reaches this exact revision.
      patches_git_url: https://github.com/CERALIVE/rk3588-kernel-patches.git
      patches_commit: df8a39ad4b0b5556f55ebfd79a9491dd3906761f
      patches_series: patches/series

      defconfig_base: defconfig
      defconfig_fragment: manifests/kernel/rk3588-edge.fragment

      # Same digest-pinned base the canonical mkosi builder uses (ci/Dockerfile).
      # The kernel builder image is derived FROM this exact digest, so the pin of
      # record is this manifest line, not a Dockerfile default.
      builder_image: debian:trixie-20260623-slim@sha256:28de0877c2189802884ccd20f15ee41c203573bd87bb6b883f5f46362d24c5c2

      local_version: -ceralive-rk3588
      kernel_release: 7.1.7-ceralive-rk3588
      package_version: 7.1.7-ceralive1

      # PLATFORM-LAYER INSTALL MAPPING. bindeb-pkg puts arm64 in-tree DTBs under
      # /usr/lib/linux-image-<KERNELRELEASE>/<vendor>/; the U-Boot boot script
      # resolves ${fdtfile} under /boot/dtb/rockchip/ (mkosi/platform/boot/
      # boot.scr.cmd). The platform layer copies source -> target so a
      # source-built kernel satisfies the SAME board dtb_name expectation an
      # Armbian linux-dtb-* package would.
      dtb_deb_dir: /usr/lib/linux-image-7.1.7-ceralive-rk3588/rockchip
      dtb_boot_dir: /boot/dtb/rockchip

  # DEBUG/TEST sibling of `edge`, and NOTHING ELSE. It exists so the Wave-6
  # negative-path QA (deterministic rkvenc/HDMI-RX fault injection, the dma-heap
  # KUnit seam) can run on a Rock 5B+ under KASAN + lockdep. It is NEVER released:
  # the release/publish guard (ci/check-release-variant.sh) rejects it by name, and
  # `ci/build-hardware-candidates.sh` builds it only as an explicitly non-shipping
  # debug artifact.
  #
  # `extends: edge` is the whole point. Every pin that decides WHAT SOURCE is
  # compiled — git_url, tag, commit, patches_git_url, patches_commit,
  # patches_series, builder_image, dtb_boot_dir — is INHERITED rather than copied,
  # so it is structurally impossible for this variant to drift onto a different
  # kernel or a different patch series than the production `edge` it is supposed to
  # be a debug build OF. A copy-paste sibling would look identical on the day it was
  # written and silently diverge on the first `edge` re-pin.
  #
  # The four fields below are the complete, deliberate difference, and each one is
  # an identity so the two artifacts can never be substituted for one another:
  # package name, LOCALVERSION, kernel release and Debian version. `dtb_deb_dir` is
  # the fifth, and it is NOT an independent choice — `make bindeb-pkg` installs the
  # in-tree DTBs under /usr/lib/<linux-image package>/, so it is a function of
  # kernel_release and has to move with it or validate_built_kernel_deb fails on a
  # path the build itself created. `dtb_boot_dir` (where the U-Boot script looks) is
  # genuinely shared and is inherited untouched.
  edge-test:
    extends: edge

    kernel_packages:
      - linux-image-7.1.7-ceralive-rk3588-test

    kernel_source:
      # ORDERED, and the order is the contract: the production fragment first, the
      # debug fragment second, so every symbol the test fragment sets wins over the
      # production answer for the same symbol. Both are merged before the SINGLE
      # olddefconfig/syncconfig/verify sequence, so the survival gate still runs
      # against everything both fragments declared.
      defconfig_fragments:
        - manifests/kernel/rk3588-edge.fragment
        - manifests/kernel/rk3588-edge-test.fragment

      local_version: -ceralive-rk3588-test
      kernel_release: 7.1.7-ceralive-rk3588-test
      package_version: 7.1.7-ceralive1+test1

      dtb_deb_dir: /usr/lib/linux-image-7.1.7-ceralive-rk3588-test/rockchip

  # VENDOR-track kernel built FROM SOURCE: the SAME 6.1.115 BSP the production
  # path installs prebuilt, plus CERALIVE/rk3588-vendor-kernel-patches. It exists
  # to restore HDMI-RX audio capture, which the stock vendor kernel lost when
  # armbian/linux-rockchip 78c67d98f221 (PR #430) unconditionally zeroed
  # hdmi-audio-codec capture channels for EVERY instance — a fix aimed at RK3576
  # HDMI-TX that killed RK3588 HDMI-RX, because rk_hdmirx registers through that
  # same codec. Board-confirmed: /proc/asound/pcm shows the card with zero
  # capture substreams and nothing anywhere reports an error.
  #
  # This is NOT `edge` with a different pin. Two things are structurally
  # different, and both are the reason build-kernel.sh grew its two general
  # modes rather than special-casing this variant:
  #
  #   1. NO TAG. rk-6.1-rkr5.1 is a rolling BSP branch that publishes no tags at
  #      all, so `tag:` is OMITTED and `commit:` is fetched directly. Do NOT add
  #      a synthetic tag to make this look like edge — there is no such ref.
  #   2. NO defconfig. Armbian ships a COMPLETE .config for this kernel, and it
  #      is the config the board actually runs. `make defconfig` would build a
  #      materially different driver/feature set, which would make any comparison
  #      against the shipped kernel meaningless. The config_* trio fetches that
  #      exact file at an exact armbian/build revision and uses it verbatim.
  #
  # Declaring this does NOT reopen decision D3 and does not change what ships:
  # the production path still installs the prebuilt linux-image-vendor-rk35xx.
  vendor-patched:
    armbian_branch: vendor

    # Deliberately NOT `linux-image-vendor-rk35xx`. A name collision with the
    # stock package is the one failure that would produce a plausible image
    # rather than an error — the local repository would resolve one of the two
    # by version and the board could silently boot the UNPATCHED kernel. The
    # orchestrator's staged-package uniqueness check exists for the same reason.
    kernel_packages:
      - linux-image-6.1.115-ceralive-vendor-rk35xx

    # The stock vendor path DOES ship a separate linux-dtb-vendor-rk35xx, but a
    # `make bindeb-pkg` build cannot: 6.1's scripts/package/builddeb runs
    # dtbs_install into /usr/lib/<linux-image package> whenever
    # CONFIG_OF_EARLY_FLATTREE is set, so the in-tree DTBs ride inside the
    # linux-image deb exactly as they do on edge. dtb_deb_dir/dtb_boot_dir below
    # are what satisfy the board's dtb_name instead.
    dtb_packages: []

    kernel_source:
      git_url: https://github.com/armbian/linux-rockchip.git

      # No `tag:` — see the note above. THE pin. Chosen upstream because its
      # commit timestamp matches the running board's kernel build stamp to the
      # second (rk3588-vendor-kernel-patches docs/PREFLIGHT.md), so this is the
      # source of the kernel the fleet is running, not merely a nearby one.
      commit: 95e85f6cb496c75807c5b16f158853578e7e7d1b

      # Five patches: two backports of real mainline ASoC commits that replace
      # the unconditional capture zeroing with per-instance opt-out flags
      # (armbian/linux-rockchip PR #487 — OPEN, not merged, which is precisely
      # why the SHAs and not the PR ref are what is pinned upstream), a
      # first-party PL330/i2s-tdm DMA-budget change validated on a real board,
      # a first-party DIAGNOSTIC patch that changes no behaviour, and 0005 —
      # the fix that diagnostic found. 0001-0003 got the capture PCM to
      # register and open while every read() still returned EIO with an empty
      # dmesg; 0004 made that printable; its output showed the HDMI-RX audio
      # domain is never enabled, because AUDIO_ENABLE / I2S_EN are set only by
      # rk_hdmirx's audio work and nothing in the ALSA capture path started it.
      # 0005 starts it. Dropping 0004 now that 0005 is confirmed is a follow-up,
      # not pending cleanup. Predecessor pin: e3f97655ae47 (0001-0004).
      #
      # de46c1acba42 carries the correction to 0005 itself: its first version
      # waited for the audio work with flush_delayed_work() from a callback that
      # ASoC invokes with hdmi-codec's hcp->lock held, while that work calls back
      # into plugged_cb() which takes the same lock — a deadlock that fires only
      # when audio IS present. It now waits on a completion the work signals
      # before that callback, and disarms the work under a gate before a
      # synchronous cancel on every teardown path.
      #
      # BOARD-CONFIRMED on a Radxa ROCK 5B+: hw_ptr advanced 15934388 ->
      # 16030718 over ~2.007 s (≈48 kHz), RXS=1 with a non-zero RXFIFOLR=0xa,
      # zero "capture xfer failed" lines, and CeraUI's audio meters showed real
      # fluctuating levels. This is a confirmed-working series, not a WIP one.
      # Predecessor pin: db5d0e8a0711 (squash-merged into de46c1a via PR #1,
      # https://github.com/CERALIVE/rk3588-vendor-kernel-patches/pull/1). The
      # squash discarded the original commits, so db5d0e8a0711 is unreachable on
      # that repo's main and a fresh clone's patch fetch would FAIL on it.
      patches_git_url: https://github.com/CERALIVE/rk3588-vendor-kernel-patches.git
      patches_commit: de46c1acba420d69d30a82b3bc0f526293efd9a3
      patches_series: patches/series

      # The exact full .config Armbian builds linux-image-vendor-rk35xx from,
      # read as a plain FILE at a pinned revision. The Armbian build framework is
      # never invoked. Resolution chain for this path (LINUXFAMILY=rk35xx,
      # BRANCH=vendor -> LINUXCONFIG=linux-rk35xx-vendor) is derived and recorded
      # in rk3588-vendor-kernel-patches/kernel-pin.env, not guessed.
      config_git_url: https://github.com/armbian/build
      config_commit: 5e2fa21ab509e9cf6afb05f3df46c9bd2b0cfa39
      config_path: config/kernel/linux-rk35xx-vendor.config

      # That config is written for a tree Armbian has already mutated: its
      # EXTRAWIFI step copies whole out-of-tree WiFi driver trees in before
      # configuring. 24 of its symbols therefore have no Kconfig entry in the
      # pinned source and are correctly discarded. Each is enumerated and
      # justified here; the gate FAILS on a listed symbol that did survive, so
      # the list cannot rot into a blanket opt-out. Neither shipped board's
      # adapter is on it — both are in-tree and both survive.
      config_absent_symbols: manifests/kernel/rk3588-vendor-patched.absent

      # BOOKWORM, not trixie — and that is a deliberate divergence from `edge`.
      # This is a 6.1 tree built with CONFIG_WERROR=y, contemporary with GCC 12;
      # trixie's GCC 14 turns warnings the Rockchip BSP was never compiled
      # against into hard errors. Bookworm also carries pahole 1.24, squarely
      # inside the band 6.1's scripts/pahole-flags.sh knows about, and is the
      # release the device itself runs. builder_image is a PER-VARIANT pin for
      # exactly this reason: each variant pins the toolchain era its source needs.
      builder_image: debian:bookworm-20260803-slim@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241

      local_version: -ceralive-vendor-rk35xx
      kernel_release: 6.1.115-ceralive-vendor-rk35xx
      package_version: 6.1.115-ceralive1

      dtb_deb_dir: /usr/lib/linux-image-6.1.115-ceralive-vendor-rk35xx/rockchip
      dtb_boot_dir: /boot/dtb/rockchip
